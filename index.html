<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Trips">
<title>Trip Manager</title>
<style>
  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --text: #1b1f24;
    --text-dim: #6b7280;
    --accent: #2563eb;
    --accent-soft: #dbeafe;
    --border: #e5e7eb;
    --danger: #dc2626;
    --warn: #d97706;
    --shadow: 0 1px 3px rgba(0,0,0,.08);
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101318;
      --surface: #1a1f27;
      --text: #e8eaed;
      --text-dim: #9aa3af;
      --accent: #60a5fa;
      --accent-soft: #1e3a5f;
      --border: #2a313c;
      --danger: #f87171;
      --warn: #fbbf24;
      --shadow: 0 1px 3px rgba(0,0,0,.4);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: env(safe-area-inset-bottom);
    min-height: 100vh;
  }

  /* ---------- Header ---------- */
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
    display: flex; align-items: center; gap: 10px;
  }
  header h1 {
    font-size: 18px; font-weight: 700; margin: 0;
    flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .icon-btn {
    background: none; border: none; color: var(--accent);
    font-size: 16px; font-weight: 600; cursor: pointer;
    padding: 6px 8px; border-radius: 8px; flex-shrink: 0;
  }
  .icon-btn:active { background: var(--accent-soft); }

  main { padding: 16px; max-width: 640px; margin: 0 auto; }

  /* ---------- Cards & lists ---------- */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 14px 16px;
    margin-bottom: 12px;
    cursor: pointer;
  }
  .card:active { opacity: .85; }
  .card h2 { margin: 0 0 2px; font-size: 17px; }
  .card .sub { color: var(--text-dim); font-size: 14px; margin: 0; }
  .card .stats { display: flex; gap: 14px; margin-top: 8px; font-size: 13px; color: var(--text-dim); }

  .empty {
    text-align: center; color: var(--text-dim);
    padding: 48px 24px; font-size: 15px; line-height: 1.6;
  }
  .empty .big { font-size: 44px; display: block; margin-bottom: 8px; }

  .btn {
    display: block; width: 100%;
    background: var(--accent); color: #fff;
    border: none; border-radius: var(--radius);
    padding: 14px; font-size: 16px; font-weight: 600;
    cursor: pointer; margin-top: 4px;
  }
  .btn:active { opacity: .85; }
  .btn.secondary {
    background: var(--surface); color: var(--accent);
    border: 1px solid var(--border);
  }
  .btn.danger { background: none; color: var(--danger); border: none; font-weight: 500; }

  /* ---------- Trip view ---------- */
  .trip-sub {
    color: var(--text-dim); font-size: 14px;
    margin: -6px 0 14px; text-align: center;
  }
  .day-chips {
    display: flex; gap: 8px; overflow-x: auto;
    padding: 8px 16px 12px; margin: 0 -16px;
    -webkit-overflow-scrolling: touch; scrollbar-width: none;
    position: sticky; top: calc(52px + env(safe-area-inset-top)); z-index: 5;
    background: var(--bg);
  }
  .day-chips::-webkit-scrollbar { display: none; }
  .chip {
    flex-shrink: 0; text-align: center;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 8px 14px; cursor: pointer;
    font-size: 13px; color: var(--text-dim); line-height: 1.3;
  }
  .chip b { display: block; font-size: 15px; color: var(--text); }
  .chip.selected { background: var(--accent); border-color: var(--accent); }
  .chip.selected b, .chip.selected { color: #fff; }

  .day-heading {
    font-size: 14px; font-weight: 600; color: var(--text-dim);
    margin: 6px 2px 10px;
    display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
  }
  .day-section { scroll-margin-top: calc(144px + env(safe-area-inset-top)); margin-bottom: 18px; }
  .mini-add {
    border: none; background: none; color: var(--accent);
    font-weight: 600; font-size: 13px; font-family: inherit;
    cursor: pointer; padding: 2px 4px; flex-shrink: 0;
  }
  .day-empty { color: var(--text-dim); font-size: 14px; margin: 0 2px 10px; }
  .day-actions { display: flex; gap: 12px; flex-shrink: 0; }
  .act-move { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
  .move-btn {
    width: 42px; height: 34px;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--bg); color: var(--accent);
    font-size: 14px; cursor: pointer;
  }
  .move-btn:disabled { opacity: .3; }
  .del-btn {
    width: 42px; height: 34px; flex-shrink: 0;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--bg); color: var(--danger);
    cursor: pointer; align-self: center;
    display: flex; align-items: center; justify-content: center;
  }
  .chip { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }

  /* ---------- Unified map tab ---------- */
  #trip-map {
    height: 56vh;
    border-radius: var(--radius); border: 1px solid var(--border);
    z-index: 0; background: var(--surface);
  }
  .map-status { text-align: center; color: var(--text-dim); font-size: 13px; margin: 10px 0 2px; }
  .map-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 10px 2px; }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-dim); }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .map-pin {
    width: 26px; height: 26px; border-radius: 50%; box-sizing: border-box;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 12px; font-weight: 700;
    border: 2px solid rgba(255, 255, 255, .92);
    box-shadow: 0 1px 4px rgba(0, 0, 0, .4);
  }
  .map-unlocated { font-size: 13px; color: var(--text-dim); margin: 6px 2px 16px; overflow-wrap: break-word; }
  .member-list { display: flex; flex-wrap: wrap; gap: 6px; padding: 2px 0; }
  .member-chip {
    background: var(--accent-soft); color: var(--text);
    border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 500;
  }
  @media (prefers-color-scheme: dark) {
    .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--surface); color: var(--text); }
    .leaflet-popup-content a { color: var(--accent); }
    .leaflet-container { background: #262b33; }
  }

  /* ---------- Hold-to-drag reordering ---------- */
  .activity { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  .drag-ghost {
    position: fixed; z-index: 100; pointer-events: none;
    margin: 0; opacity: .95;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .28);
    transform: scale(1.02);
  }
  .drag-src { opacity: .35; }

  /* ---------- Activities ---------- */
  .activity {
    display: flex; gap: 12px; align-items: flex-start;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 12px 14px; margin-bottom: 10px; cursor: pointer;
  }
  .activity:active { opacity: .85; }
  .act-time {
    flex-shrink: 0; width: 62px;
    font-size: 13px; font-weight: 600; color: var(--accent);
    line-height: 1.4; padding-top: 2px;
  }
  .act-time .end { color: var(--text-dim); font-weight: 400; display: block; }
  .act-main { flex: 1; min-width: 0; }
  .act-title { font-size: 15px; font-weight: 600; margin: 0; }
  .act-meta { font-size: 13px; color: var(--text-dim); margin-top: 3px; overflow-wrap: break-word; }
  .act-notes { font-size: 13px; color: var(--text-dim); margin-top: 4px; white-space: pre-wrap; }
  .act-cost { flex-shrink: 0; font-size: 14px; font-weight: 600; padding-top: 2px; }

  .day-total {
    text-align: right; font-size: 14px; color: var(--text-dim);
    margin: 4px 4px 14px;
  }
  .day-total b { color: var(--text); }

  .map-link { color: var(--accent); text-decoration: none; }
  .map-link:active { text-decoration: underline; }

  /* ---------- Per-day map ---------- */
  .day-map { margin: 2px 2px 16px; }
  .map-toggle {
    display: block; width: 100%; text-align: left;
    background: var(--surface); border: 1px solid var(--border);
    color: var(--accent); font-weight: 600; font-size: 13px; font-family: inherit;
    cursor: pointer; padding: 10px 12px; border-radius: 10px;
  }
  .map-toggle:active { background: var(--accent-soft); }
  .map-toggle[aria-expanded="true"] { border-radius: 10px 10px 0 0; }
  .day-map-frame {
    display: block; width: 100%; height: 280px; border: 0;
    border: 1px solid var(--border); border-top: none;
    border-radius: 0 0 10px 10px; background: var(--bg);
  }

  /* ---------- Tabs (Itinerary | Budget) ---------- */
  .tabs {
    display: flex; gap: 2px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 3px; margin-bottom: 14px;
  }
  .tabs button {
    flex: 1; border: none; background: none; cursor: pointer;
    padding: 8px; font-size: 14px; font-weight: 600; font-family: inherit;
    color: var(--text-dim); border-radius: 9px;
  }
  .tabs button.selected { background: var(--accent); color: #fff; }

  /* ---------- Budget screen ---------- */
  .budget-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 18px 16px; margin-bottom: 6px;
  }
  .hero-label { font-size: 13px; font-weight: 600; color: var(--text-dim); margin: 0 0 4px; }
  .hero-value { font-size: 48px; font-weight: 600; line-height: 1.1; margin: 0; overflow-wrap: break-word; }
  .hero-sub { font-size: 14px; color: var(--text-dim); margin: 8px 0 0; }
  .meter { height: 10px; border-radius: 5px; background: var(--accent-soft); margin-top: 16px; overflow: hidden; }
  .meter-fill { height: 100%; background: var(--accent); border-radius: 0 5px 5px 0; }
  .meter-fill.warn { background: var(--warn); }
  .meter-fill.over { background: var(--danger); }

  .section-title { font-size: 14px; font-weight: 700; margin: 20px 2px 6px; }
  .brk-row {
    display: grid; grid-template-columns: minmax(100px, 36%) 1fr auto;
    gap: 10px; align-items: center;
    padding: 7px 2px; font-size: 14px;
  }
  .brk-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .brk-label .sub { color: var(--text-dim); }
  .brk-bar { height: 8px; border-radius: 0 4px 4px 0; background: var(--accent); min-width: 2px; }
  .brk-val { font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; }
  .brk-val.zero { color: var(--text-dim); font-weight: 400; }

  /* ---------- Modal (bottom sheet) ---------- */
  #modal {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(0,0,0,.45);
    display: none; align-items: flex-end; justify-content: center;
  }
  #modal.open { display: flex; }
  .sheet {
    background: var(--surface);
    border-radius: 20px 20px 0 0;
    width: 100%; max-width: 640px;
    max-height: 88vh; overflow-y: auto;
    padding: 20px 20px calc(24px + env(safe-area-inset-bottom));
    animation: slideUp .22s ease-out;
  }
  @keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  .sheet h3 { margin: 0 0 16px; font-size: 18px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; font-weight: 600; color: var(--text-dim); margin-bottom: 5px; }
  .field input, .field select, .field textarea {
    width: 100%; padding: 11px 12px;
    font-size: 16px; font-family: inherit;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    appearance: none; -webkit-appearance: none;
  }
  .field textarea { resize: vertical; min-height: 64px; }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; min-width: 0; }
</style>
</head>
<body>

<header>
  <button class="icon-btn" id="back-btn" data-action="back" hidden>‹ Trips</button>
  <h1 id="header-title">Trip Manager</h1>
  <button class="icon-btn" id="header-action" hidden></button>
</header>

<main id="app"></main>

<div id="modal"></div>
<input type="file" id="import-file" accept=".json,application/json" hidden>

<script>
"use strict";

/* ================= Data layer ================= */

const STORE_KEY = "tripManager.v1";

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      if (data && Array.isArray(data.trips)) return data;
    }
  } catch (e) { /* corrupted storage: start fresh */ }
  return { trips: [] };
}

function save() {
  localStorage.setItem(STORE_KEY, JSON.stringify(db));
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

const db = load();

const CATEGORIES = [
  ["food",        "🍽️", "Food & drink"],
  ["sightseeing", "🏛️", "Sightseeing"],
  ["transport",   "🚆", "Transport"],
  ["lodging",     "🏨", "Lodging"],
  ["activity",    "🎟️", "Activity"],
  ["shopping",    "🛍️", "Shopping"],
  ["other",       "📌", "Other"],
];

function categoryLabel(key) {
  const c = CATEGORIES.find(c => c[0] === key) || CATEGORIES[CATEGORIES.length - 1];
  return c[1] + " " + c[2];
}

/* ================= Helpers ================= */

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

// Parse "YYYY-MM-DD" as a local date (avoids UTC off-by-one).
function parseDate(s) {
  const [y, m, d] = s.split("-").map(Number);
  return new Date(y, m - 1, d);
}

function toISO(d) {
  return d.getFullYear() + "-" +
    String(d.getMonth() + 1).padStart(2, "0") + "-" +
    String(d.getDate()).padStart(2, "0");
}

function fmtDate(iso, opts) {
  return parseDate(iso).toLocaleDateString(undefined, opts);
}

function fmtRange(a, b) {
  const sameYear = a.slice(0, 4) === b.slice(0, 4);
  const start = fmtDate(a, { month: "short", day: "numeric", year: sameYear ? undefined : "numeric" });
  const end = fmtDate(b, { month: "short", day: "numeric", year: "numeric" });
  return start + " – " + end;
}

function fmtTime(hhmm) {
  if (!hhmm) return "";
  const [h, m] = hhmm.split(":").map(Number);
  return new Date(2000, 0, 1, h, m).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
}

function fmtMoney(n, currency) {
  return (currency || "$") + Number(n).toLocaleString(undefined, { maximumFractionDigits: 2 });
}

function getTrip(id) {
  return db.trips.find(t => t.id === id);
}

// All dates in the trip's range, capped defensively at 120 days.
function tripDays(trip) {
  const days = [];
  const d = parseDate(trip.startDate);
  const end = parseDate(trip.endDate);
  while (d <= end && days.length < 120) {
    days.push(toISO(d));
    d.setDate(d.getDate() + 1);
  }
  return days;
}

function tripTotalCost(trip) {
  return trip.activities.reduce((sum, a) => sum + (a.cost || 0), 0);
}

/* ================= Export / import ================= */

function slugify(s) {
  return s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "trip";
}

function exportTrip(trip) {
  const data = { app: "trip-manager", version: 1, trip };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = slugify(trip.name) + ".json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// Cached geocode result riding on an activity: {q, lat, lng} for a hit,
// {q, ok:false} for a definitive miss. q is the location string it was
// computed from, so edits invalidate the cache.
function sanitizeGeo(g) {
  if (!g || typeof g !== "object" || typeof g.q !== "string") return null;
  if (typeof g.lat === "number" && isFinite(g.lat) && typeof g.lng === "number" && isFinite(g.lng)) {
    return { q: g.q.slice(0, 160), lat: g.lat, lng: g.lng };
  }
  if (g.ok === false) return { q: g.q.slice(0, 160), ok: false };
  return null;
}

// Validate and normalize an imported trip. Throws with a readable
// message on anything that doesn't look like a trip; silently drops
// malformed activities and unknown fields.
function sanitizeTrip(raw) {
  if (!raw || typeof raw !== "object") throw new Error("this file doesn't contain a trip");
  const isDate = s => typeof s === "string" && /^\d{4}-\d{2}-\d{2}$/.test(s);
  const isTime = s => typeof s === "string" && /^([01]?\d|2[0-3]):[0-5]\d$/.test(s);
  if (typeof raw.name !== "string" || !raw.name.trim()) throw new Error("the trip has no name");
  if (!isDate(raw.startDate) || !isDate(raw.endDate)) throw new Error("the trip dates are missing or invalid");

  const trip = {
    id: typeof raw.id === "string" ? raw.id : uid(),
    name: raw.name.trim().slice(0, 80),
    destination: typeof raw.destination === "string" ? raw.destination.trim().slice(0, 80) : "",
    startDate: raw.startDate,
    endDate: raw.endDate,
    currency: (typeof raw.currency === "string" && raw.currency.trim()) ? raw.currency.trim().slice(0, 5) : "$",
    budget: (typeof raw.budget === "number" && isFinite(raw.budget) && raw.budget > 0) ? raw.budget : null,
    activities: [],
  };
  if (trip.endDate < trip.startDate) [trip.startDate, trip.endDate] = [trip.endDate, trip.startDate];

  for (const a of Array.isArray(raw.activities) ? raw.activities : []) {
    if (!a || typeof a !== "object") continue;
    if (typeof a.title !== "string" || !a.title.trim() || !isDate(a.date)) continue;
    trip.activities.push({
      id: typeof a.id === "string" ? a.id : uid(),
      title: a.title.trim().slice(0, 120),
      date: a.date,
      startTime: isTime(a.startTime) ? a.startTime : "",
      endTime: isTime(a.endTime) ? a.endTime : "",
      category: CATEGORIES.some(c => c[0] === a.category) ? a.category : "other",
      location: typeof a.location === "string" ? a.location.trim().slice(0, 160) : "",
      cost: (typeof a.cost === "number" && isFinite(a.cost) && a.cost >= 0) ? a.cost : null,
      order: (typeof a.order === "number" && isFinite(a.order)) ? a.order : null,
      geo: sanitizeGeo(a.geo),
      notes: typeof a.notes === "string" ? a.notes.trim().slice(0, 1000) : "",
    });
  }
  return trip;
}

/* ---- Share by link: trip JSON, deflated, base64url, in the URL hash.
   The hash is never sent to the server, so shared trips stay private. ---- */

function b64url(bytes) {
  let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000)
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}

function unb64url(s) {
  const bin = atob(s.replace(/-/g, "+").replace(/_/g, "/"));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

// "z:" = deflate-compressed, "j:" = plain JSON (fallback for old browsers).
async function encodeShare(str) {
  const bytes = new TextEncoder().encode(str);
  if (typeof CompressionStream === "undefined") return "j:" + b64url(bytes);
  const stream = new Blob([bytes]).stream().pipeThrough(new CompressionStream("deflate-raw"));
  return "z:" + b64url(new Uint8Array(await new Response(stream).arrayBuffer()));
}

async function decodeShare(payload) {
  const kind = payload.slice(0, 2), bytes = unb64url(payload.slice(2));
  if (kind === "j:") return new TextDecoder().decode(bytes);
  if (kind === "z:") {
    if (typeof DecompressionStream === "undefined")
      throw new Error("this browser can't open compressed trip links — ask for the file export instead");
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    return new Response(stream).text();
  }
  throw new Error("unrecognized link format");
}

async function shareTrip(trip) {
  const payload = await encodeShare(JSON.stringify({ app: "trip-manager", version: 1, trip }));
  const url = location.origin + location.pathname + "#trip=" + payload;
  if (navigator.share) {
    try { await navigator.share({ title: trip.name, url }); return; }
    catch (e) { if (e.name === "AbortError") return; /* else fall through to clipboard */ }
  }
  try {
    await navigator.clipboard.writeText(url);
    alert("Share link copied to clipboard.");
  } catch (e) {
    prompt("Copy this link:", url);
  }
}

async function handleSharedLink() {
  // Live shared-trip invite: #join=<firestore trip id>
  const j = location.hash.match(/^#join=([A-Za-z0-9_-]{8,})$/);
  if (j) {
    history.replaceState(null, "", location.pathname + location.search);
    joinSharedTrip(j[1]);
    return;
  }
  // Value-copy link: #trip=<encoded trip json>
  const m = location.hash.match(/^#trip=(.+)$/);
  if (!m) return;
  // Clear the hash first so refresh/back doesn't re-prompt.
  history.replaceState(null, "", location.pathname + location.search);
  try {
    const data = JSON.parse(await decodeShare(decodeURIComponent(m[1])));
    const trip = sanitizeTrip(data && data.trip ? data.trip : data);
    if (confirm(`Import shared trip "${trip.name}" (${trip.activities.length} activities)?`)) {
      importTripFromData(trip);
    }
  } catch (err) {
    alert("Couldn't open shared trip link: " + err.message);
  }
}

function importTripFromData(data) {
  const trip = sanitizeTrip(data && data.trip ? data.trip : data);
  const existingIdx = db.trips.findIndex(t => t.id === trip.id);
  if (existingIdx >= 0) {
    const replace = confirm(
      `"${db.trips[existingIdx].name}" already exists here.\n\nOK = replace it with the imported version\nCancel = keep both (import as a copy)`);
    if (replace) {
      db.trips[existingIdx] = trip;
    } else {
      trip.id = uid();
      trip.name = (trip.name + " (copy)").slice(0, 80);
      db.trips.push(trip);
    }
  } else {
    db.trips.push(trip);
  }
  state.view = "trip";
  state.tripId = trip.id;
  state.selectedDate = null;
  save();
  render();
}

/* ----- Single trip ----- */

const byStartTime = (a, b) => (a.startTime || "99:99").localeCompare(b.startTime || "99:99");

// Display order within a day: manual order (if set) wins; otherwise by time.
// A day starts with no manual orders (pure time sort); the first arrow tap
// freezes the visual order into explicit indexes, which then stick.
const ord = a => (Number.isFinite(a.order) ? a.order : 1e9);
const byDayOrder = (a, b) => (ord(a) - ord(b)) || byStartTime(a, b);

// Rearrange whole days: newDateOrder is the trip's dates in the user's
// arranged sequence; the plan that was on newDateOrder[k] moves to the
// k-th chronological date. Per-day manual orders travel with their
// activities, so each day keeps its internal sequence.
function reorderDays(trip, newDateOrder) {
  const days = tripDays(trip);
  const dest = new Map();
  newDateOrder.forEach((oldDate, k) => {
    if (oldDate !== days[k]) dest.set(oldDate, days[k]);
  });
  if (!dest.size) return;
  const moved = [];
  for (const a of trip.activities) {
    if (dest.has(a.date)) { a.date = dest.get(a.date); moved.push(a); }
  }
  if (trip.shared && moved.length) {
    cloudCall(() => cloudBatchUpdate(trip.id, moved.map(a => ({ id: a.id, fields: { date: a.date } }))));
  }
  save();
}

function moveActivity(trip, id, dir) {
  const act = trip.activities.find(a => a.id === id);
  if (!act) return;
  const dayList = trip.activities.filter(a => a.date === act.date).sort(byDayOrder);
  const idx = dayList.indexOf(act);
  const target = idx + (dir === "up" ? -1 : 1);
  if (target < 0 || target >= dayList.length) return;
  dayList.forEach((a, i) => { a.order = i; }); // freeze current visual order
  dayList[idx].order = target;
  dayList[target].order = idx;
  if (trip.shared) {
    cloudCall(() => cloudBatchUpdate(trip.id, dayList.map(a => ({ id: a.id, fields: { order: a.order } }))));
  }
  save();
}

// Ordered list of a day's stop locations, in display order (manual order
// wins over times), dropping blanks and collapsing consecutive repeats.
function dayLocations(acts) {
  const locs = [];
  for (const a of [...acts].sort(byDayOrder)) {
    const loc = (a.location || "").trim();
    if (loc && loc !== locs[locs.length - 1]) locs.push(loc);
  }
  return locs;
}

// Keyless Google Maps embed for a day: a single place gets a search embed,
// two or more become a route through the stops in order (saddr + "to:" chain).
function mapEmbedSrc(locs) {
  if (locs.length === 0) return null;
  if (locs.length === 1) {
    return "https://maps.google.com/maps?output=embed&q=" + encodeURIComponent(locs[0]);
  }
  const saddr = encodeURIComponent(locs[0]);
  const daddr = locs.slice(1).map(encodeURIComponent).join("+to:");
  return "https://maps.google.com/maps?output=embed&saddr=" + saddr + "&daddr=" + daddr;
}

// A collapsible map for one day. Returns "" when the day has no locations.
// The iframe is injected lazily on tap (see the "toggle-map" handler) so an
// all-days overview doesn't spin up a dozen maps at once.
function mapSectionHTML(acts, key) {
  const locs = dayLocations(acts);
  const src = mapEmbedSrc(locs);
  if (!src) return "";
  const label = locs.length === 1 ? "Show place on map" : `Show ${locs.length} stops on map`;
  return `
  <div class="day-map" id="map-${esc(key)}">
    <button class="map-toggle" data-action="toggle-map"
      data-src="${esc(src)}" data-label="${esc(label)}" aria-expanded="false">🗺️ ${esc(label)}</button>
  </div>`;
}

function activityCardHTML(trip, a, reorder, isFirst, isLast) {
  const mapLink = a.location
    ? `<a class="map-link" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(a.location)}"
         target="_blank" rel="noopener">📍 ${esc(a.location)}</a>`
    : "";
  const meta = [categoryLabel(a.category), mapLink].filter(Boolean).join(" · ");
  const tail = reorder
    ? `<div class="act-move">
         <button class="move-btn" data-action="move-act" data-id="${a.id}" data-dir="up" ${isFirst ? "disabled" : ""}>▲</button>
         <button class="move-btn" data-action="move-act" data-id="${a.id}" data-dir="down" ${isLast ? "disabled" : ""}>▼</button>
       </div>`
    : (a.cost ? `<div class="act-cost">${fmtMoney(a.cost, trip.currency)}</div>` : "");
  const lead = reorder
    ? `<button class="del-btn" data-action="delete-activity" data-id="${a.id}" aria-label="Delete">
         <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
           <path d="M3 6h18"/>
           <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
           <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
           <line x1="10" y1="11" x2="10" y2="17"/>
           <line x1="14" y1="11" x2="14" y2="17"/>
         </svg>
       </button>`
    : `<div class="act-time">${a.startTime ? fmtTime(a.startTime) : "—"}
        ${a.endTime ? `<span class="end">– ${fmtTime(a.endTime)}</span>` : ""}
      </div>`;
  return `
  <div class="activity" data-action="edit-activity" data-id="${a.id}">
    ${lead}
    <div class="act-main">
      <p class="act-title">${esc(a.title)}</p>
      <div class="act-meta">${meta}</div>
      ${a.notes ? `<div class="act-notes">${esc(a.notes)}</div>` : ""}
    </div>
    ${tail}
  </div>`;
}

function daySectionHTML(trip, d, i) {
  const acts = trip.activities.filter(a => a.date === d).sort(byDayOrder);
  const total = acts.reduce((s, a) => s + (a.cost || 0), 0);
  const reordering = state.reorderDate === d;
  return `
  <section class="day-section" id="day-${d}">
    <div class="day-heading">
      <span>${fmtDate(d, { weekday: "long", month: "long", day: "numeric" })} · Day ${i + 1}</span>
      <span class="day-actions">
        ${acts.length ? `<button class="mini-add" data-action="toggle-reorder" data-date="${d}">${reordering ? "✓ Done" : "✎ Edit"}</button>` : ""}
        <button class="mini-add" data-action="add-activity" data-date="${d}">+ Add</button>
      </span>
    </div>
    <div class="day-cards" data-date="${d}">
      ${acts.map((a, k) => activityCardHTML(trip, a, reordering, k === 0, k === acts.length - 1)).join("") || `<div class="day-empty">Nothing planned.</div>`}
    </div>
    ${total ? `<div class="day-total">Day total: <b>${fmtMoney(total, trip.currency)}</b></div>` : ""}
    ${mapSectionHTML(acts, d)}
  </section>`;
}

function orphanSectionHTML(trip, orphans) {
  return `
  <section class="day-section" id="day-other">
    <div class="day-heading"><span>⚠️ Outside trip dates — edit to pick a day</span></div>
    ${[...orphans].sort(byStartTime).map(a => activityCardHTML(trip, a)).join("")}
    ${mapSectionHTML(orphans, "other")}
  </section>`;
}

function scrollToDay(date, smooth) {
  const sec = document.getElementById("day-" + date) || document.getElementById("day-other");
  if (sec) sec.scrollIntoView({ behavior: smooth ? "smooth" : "auto", block: "start" });
}

function renderTrip() {
  const trip = getTrip(state.tripId);
  state.view = "trip";
  $title.textContent = trip.name;
  $back.hidden = false;
  $headerAction.hidden = false;
  $headerAction.textContent = "Edit";
  $headerAction.dataset.action = "edit-trip";
  $headerAction.dataset.id = trip.id;

  const days = tripDays(trip);
  const orphans = trip.activities.filter(a => !days.includes(a.date));

  // Default selected day: today if in range, else first day.
  const today = toISO(new Date());
  if (!days.includes(state.selectedDate) && state.selectedDate !== "other" && state.selectedDate !== "all") {
    state.selectedDate = days.includes(today) ? today : days[0];
  }
  if (state.selectedDate === "other" && orphans.length === 0) {
    state.selectedDate = days[0];
  }

  let chips = `<div class="chip${state.selectedDate === "all" ? " selected" : ""}"
    data-action="select-day" data-date="all">☰<b>All</b>${days.length} days</div>`;
  days.forEach((d, i) => {
    const sel = d === state.selectedDate ? " selected" : "";
    chips += `<div class="chip${sel}" data-action="select-day" data-date="${d}">
      ${fmtDate(d, { weekday: "short" })}<b>${parseDate(d).getDate()}</b>Day ${i + 1}
    </div>`;
  });
  if (orphans.length) {
    const sel = state.selectedDate === "other" ? " selected" : "";
    chips += `<div class="chip${sel}" data-action="select-day" data-date="other">⚠️<b>${orphans.length}</b>Other</div>`;
  }

  let itinerary;
  if (state.selectedDate === "all") {
    // Overview: every day in sequence; chips act as jump-links.
    itinerary =
      days.map((d, i) => daySectionHTML(trip, d, i)).join("") +
      (orphans.length ? orphanSectionHTML(trip, orphans) : "") +
      `<button class="btn" data-action="add-activity">+ Add Activity</button>`;
  } else {
    let dayActs, heading;
    if (state.selectedDate === "other") {
      dayActs = orphans;
      heading = "Activities outside the trip dates — edit them to pick a day";
    } else {
      dayActs = trip.activities.filter(a => a.date === state.selectedDate);
      heading = `${fmtDate(state.selectedDate, { weekday: "long", month: "long", day: "numeric" })} · Day ${days.indexOf(state.selectedDate) + 1} of ${days.length}`;
    }
    const isRealDay = state.selectedDate !== "other";
    dayActs.sort(isRealDay ? byDayOrder : byStartTime);
    const reordering = isRealDay && state.reorderDate === state.selectedDate;

    let list = "";
    if (dayActs.length === 0) {
      list = `<div class="empty"><span class="big">🗓️</span>Nothing planned for this day yet.</div>`;
    } else {
      const cards = dayActs.map((a, i) => activityCardHTML(trip, a, reordering, i === 0, i === dayActs.length - 1)).join("");
      list = isRealDay ? `<div class="day-cards" data-date="${state.selectedDate}">${cards}</div>` : cards;
      const dayTotal = dayActs.reduce((s, a) => s + (a.cost || 0), 0);
      if (dayTotal) list += `<div class="day-total">Day total: <b>${fmtMoney(dayTotal, trip.currency)}</b></div>`;
    }
    itinerary = `<div class="day-heading"><span>${heading}</span>
        <span class="day-actions">
          ${isRealDay && dayActs.length ? `<button class="mini-add" data-action="toggle-reorder" data-date="${state.selectedDate}">${reordering ? "✓ Done" : "✎ Edit"}</button>` : ""}
        </span>
      </div>
      ${list}
      ${mapSectionHTML(dayActs, state.selectedDate)}
      <button class="btn" data-action="add-activity">+ Add Activity</button>`;
  }

  // Map tab disabled for now. To restore the unified map view, put this
  // button back in the tabs row below and re-enable the two "map" lines
  // in the content expression and after the innerHTML assignment:
  //   <button class="${state.tab === "map" ? "selected" : ""}" data-action="set-tab" data-tab="map">Map</button>
  const tabs = `
    <div class="tabs">
      <button class="${state.tab === "budget" || state.tab === "map" ? "" : "selected"}" data-action="set-tab" data-tab="itinerary">Itinerary</button>
      <button class="${state.tab === "budget" ? "selected" : ""}" data-action="set-tab" data-tab="budget">Budget</button>
    </div>`;

  const content = state.tab === "budget"
    ? renderBudgetHTML(trip)
    // : state.tab === "map" ? renderMapTabHTML()
    : `<div class="day-chips">${chips}</div>${itinerary}`;

  $app.innerHTML = `
    <p class="trip-sub">${esc(trip.destination)} · ${fmtRange(trip.startDate, trip.endDate)}</p>
    ${tabs}
    ${content}`;

  // if (state.tab === "map") initTripMap(trip.id);

  // A fresh render resets the chip row's horizontal scroll to 0, which
  // hides later days. Center the selected chip in the row (the browser
  // clamps at both ends, so edge days sit as close to center as possible).
  const row = $app.querySelector(".day-chips");
  const sel = row && row.querySelector(".chip.selected");
  if (sel) {
    const r = row.getBoundingClientRect(), c = sel.getBoundingClientRect();
    row.scrollLeft += (c.left + c.width / 2) - (r.left + r.width / 2);
  }
}

/* ----- Budget screen ----- */

function renderBudgetHTML(trip) {
  const total = tripTotalCost(trip);
  const cur = trip.currency;

  // Hero: total spent, with a budget meter when a budget is set.
  let hero = `<div class="budget-card">
    <p class="hero-label">Total spent</p>
    <p class="hero-value">${fmtMoney(total, cur)}</p>`;
  if (trip.budget) {
    const pct = (total / trip.budget) * 100;
    const cls = pct > 100 ? " over" : pct >= 85 ? " warn" : "";
    hero += `
    <div class="meter"><div class="meter-fill${cls}" style="width:${Math.min(100, pct).toFixed(1)}%"></div></div>
    <p class="hero-sub">${pct > 100
      ? `⚠️ Over budget by ${fmtMoney(total - trip.budget, cur)} · budget ${fmtMoney(trip.budget, cur)}`
      : `${Math.round(pct)}% of ${fmtMoney(trip.budget, cur)} budget · ${fmtMoney(trip.budget - total, cur)} left`}</p>`;
  } else {
    hero += `<p class="hero-sub">No budget set — add one via Edit to track spending against it.</p>`;
  }
  hero += `</div>`;

  if (total === 0) {
    return hero + `<div class="empty"><span class="big">💸</span>
      No costs yet.<br>Add costs to activities and the breakdown appears here.</div>`;
  }

  // By category, largest first.
  const byCat = new Map();
  for (const a of trip.activities) {
    if (a.cost) byCat.set(a.category, (byCat.get(a.category) || 0) + a.cost);
  }
  const cats = [...byCat.entries()].sort((x, y) => y[1] - x[1]);
  const maxCat = cats.length ? cats[0][1] : 0;
  let catRows = "";
  for (const [key, amount] of cats) {
    catRows += `<div class="brk-row">
      <div class="brk-label">${categoryLabel(key)}</div>
      <div><div class="brk-bar" style="width:${(amount / maxCat * 100).toFixed(1)}%"></div></div>
      <div class="brk-val">${fmtMoney(amount, cur)}</div>
    </div>`;
  }

  // By day, chronological; orphan activities grouped as "Other".
  const days = tripDays(trip);
  const byDay = new Map(days.map(d => [d, 0]));
  let orphanCost = 0;
  for (const a of trip.activities) {
    if (!a.cost) continue;
    if (byDay.has(a.date)) byDay.set(a.date, byDay.get(a.date) + a.cost);
    else orphanCost += a.cost;
  }
  const maxDay = Math.max(...byDay.values(), orphanCost);
  let dayRows = "";
  days.forEach((d, i) => {
    const amount = byDay.get(d);
    dayRows += `<div class="brk-row">
      <div class="brk-label">Day ${i + 1} <span class="sub">· ${fmtDate(d, { weekday: "short", month: "short", day: "numeric" })}</span></div>
      <div>${amount ? `<div class="brk-bar" style="width:${(amount / maxDay * 100).toFixed(1)}%"></div>` : ""}</div>
      <div class="brk-val${amount ? "" : " zero"}">${amount ? fmtMoney(amount, cur) : "–"}</div>
    </div>`;
  });
  if (orphanCost) {
    dayRows += `<div class="brk-row">
      <div class="brk-label">⚠️ Other <span class="sub">· outside trip dates</span></div>
      <div><div class="brk-bar" style="width:${(orphanCost / maxDay * 100).toFixed(1)}%"></div></div>
      <div class="brk-val">${fmtMoney(orphanCost, cur)}</div>
    </div>`;
  }

  return hero +
    `<div class="section-title">By category</div>${catRows}` +
    `<div class="section-title">By day</div>${dayRows}`;
}

/* ================= Form submission ================= */

document.addEventListener("submit", e => {
  e.preventDefault();
  const form = e.target;
  const f = new FormData(form);

  if (form.id === "trip-form") {
    let startDate = f.get("startDate"), endDate = f.get("endDate");
    if (endDate < startDate) [startDate, endDate] = [endDate, startDate];
    const budget = parseFloat(f.get("budget"));
    const fields = {
      name: f.get("name").trim(),
      destination: f.get("destination").trim(),
      startDate, endDate,
      currency: (f.get("currency") || "").trim() || "$",
      budget: (isNaN(budget) || budget <= 0) ? null : budget,
    };
    const existing = getTrip(form.dataset.id);
    if (existing) {
      const changed = {};
      for (const k of Object.keys(fields)) {
        if (existing[k] !== fields[k]) changed[k] = fields[k];
      }
      Object.assign(existing, fields);
      if (existing.shared && Object.keys(changed).length) {
        cloudCall(() => cloudUpdateTrip(existing.id, changed));
      }
    } else {
      const trip = Object.assign({ id: uid(), activities: [] }, fields);
      db.trips.push(trip);
      state.tripId = trip.id;
    }
    state.view = "trip";
    if (state.selectedDate !== "all") state.selectedDate = null;
    save(); closeModal(); render();
  }

  if (form.id === "activity-form") {
    const trip = getTrip(state.tripId);
    if (!trip) return;
    const cost = parseFloat(f.get("cost"));
    const fields = {
      title: f.get("title").trim(),
      date: f.get("date"),
      startTime: f.get("startTime"),
      endTime: f.get("endTime"),
      category: f.get("category"),
      location: f.get("location").trim(),
      cost: isNaN(cost) ? null : cost,
      notes: f.get("notes").trim(),
    };
    const existing = trip.activities.find(a => a.id === form.dataset.id);
    if (existing) {
      const changed = {};
      for (const k of Object.keys(fields)) {
        if (existing[k] !== fields[k]) changed[k] = fields[k];
      }
      if (fields.date !== existing.date) { existing.order = null; changed.order = null; } // moved days: rejoin by time
      Object.assign(existing, fields);
      if (trip.shared && Object.keys(changed).length) {
        cloudCall(() => cloudUpdateActivity(trip.id, existing.id, changed));
      }
    } else {
      const act = Object.assign({ id: uid() }, fields);
      trip.activities.push(act);
      if (trip.shared) cloudCall(() => cloudSetActivity(trip.id, act));
    }
    if (state.selectedDate !== "all" && tripDays(trip).includes(fields.date)) state.selectedDate = fields.date;
    save(); closeModal(); render();
    if (state.selectedDate === "all") scrollToDay(fields.date);
  }
});

/* ================= Cloud sync (shared trips) ================= */
/* A shared trip lives in Firestore: trips/{id} holds the metadata and
   trips/{id}/activities/{actId} one document per activity, so friends
   editing different activities never conflict. The trip's random ID is
   the capability — the invite link is #join=<id>. The localStorage copy
   acts as the offline cache; snapshots keep it fresh. */

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCWwqWeS8PKUCeIgBYEXnusdCU1TvYCCCk",
  authDomain: "trip-manager-50d33.firebaseapp.com",
  projectId: "trip-manager-50d33",
  storageBucket: "trip-manager-50d33.firebasestorage.app",
  messagingSenderId: "266611855715",
  appId: "1:266611855715:web:3e4fc8569287b5dfcac356",
};

let cloud = null; // { fs, db, uid } once initialized

// Lazy: Firebase loads and signs in (anonymously) only when a sharing
// feature is first used, so purely local usage makes no network calls.
async function cloudInit() {
  if (cloud) return cloud;
  const [appM, authM, fs] = await Promise.all([
    import("./vendor/firebase-app.js"),
    import("./vendor/firebase-auth.js"),
    import("./vendor/firebase-firestore.js"),
  ]);
  const app = appM.initializeApp(FIREBASE_CONFIG);
  const db = fs.initializeFirestore(app, {
    localCache: fs.persistentLocalCache({ tabManager: fs.persistentMultipleTabManager() }),
  });
  const auth = authM.getAuth(app);
  // Reuse the persisted anonymous user (works offline); first-ever
  // sign-in needs the network.
  const existing = await new Promise(res => {
    const off = authM.onAuthStateChanged(auth, u => { off(); res(u); });
  });
  const uid = existing ? existing.uid : (await authM.signInAnonymously(auth)).user.uid;
  cloud = { fs, db, uid };
  return cloud;
}

// Fire-and-forget cloud write. Firestore queues writes made offline, so
// a rejection here is a real problem (rules, deleted doc) worth surfacing.
function cloudCall(fn) {
  fn().catch(err => {
    console.error(err);
    alert("Sync failed: " + err.message);
  });
}

function tripMetaDoc(trip) {
  return {
    name: trip.name, destination: trip.destination,
    startDate: trip.startDate, endDate: trip.endDate,
    currency: trip.currency, budget: trip.budget || null,
    members: trip.members || {},
  };
}

function activityDoc(a) {
  return {
    title: a.title, date: a.date, startTime: a.startTime, endTime: a.endTime,
    category: a.category, location: a.location,
    cost: a.cost === undefined ? null : a.cost,
    order: a.order === undefined ? null : a.order,
    geo: a.geo || null,
    notes: a.notes,
  };
}

async function cloudMakeShared(trip, myName) {
  const c = await cloudInit();
  const ref = c.fs.doc(c.fs.collection(c.db, "trips"));
  trip.members = {};
  trip.members[c.uid] = myName;
  const batch = c.fs.writeBatch(c.db);
  batch.set(ref, tripMetaDoc(trip));
  for (const a of trip.activities) {
    batch.set(c.fs.doc(c.db, "trips", ref.id, "activities", a.id), activityDoc(a));
  }
  await batch.commit();
  return ref.id;
}

async function cloudUpdateTrip(tripId, fields) {
  const c = await cloudInit();
  await c.fs.updateDoc(c.fs.doc(c.db, "trips", tripId), fields);
}

async function cloudSetActivity(tripId, act) {
  const c = await cloudInit();
  await c.fs.setDoc(c.fs.doc(c.db, "trips", tripId, "activities", act.id), activityDoc(act));
}

async function cloudUpdateActivity(tripId, actId, fields) {
  const c = await cloudInit();
  await c.fs.updateDoc(c.fs.doc(c.db, "trips", tripId, "activities", actId), fields);
}

async function cloudDeleteActivity(tripId, actId) {
  const c = await cloudInit();
  await c.fs.deleteDoc(c.fs.doc(c.db, "trips", tripId, "activities", actId));
}

async function cloudBatchUpdate(tripId, updates) {
  const c = await cloudInit();
  const batch = c.fs.writeBatch(c.db);
  for (const u of updates) {
    batch.update(c.fs.doc(c.db, "trips", tripId, "activities", u.id), u.fields);
  }
  await batch.commit();
}

async function cloudDeleteTrip(tripId) {
  const c = await cloudInit();
  const snap = await c.fs.getDocs(c.fs.collection(c.db, "trips", tripId, "activities"));
  const batch = c.fs.writeBatch(c.db);
  snap.docs.forEach(d => batch.delete(d.ref));
  batch.delete(c.fs.doc(c.db, "trips", tripId));
  await batch.commit();
}

/* ----- live listener for the currently open shared trip ----- */

let unsubTrip = null;

function detachTripListener() {
  if (unsubTrip) { unsubTrip(); unsubTrip = null; }
}

async function attachTripListener(tripId) {
  detachTripListener();
  let c;
  try { c = await cloudInit(); }
  catch (err) { console.error(err); return; } // offline before first sign-in
  if (state.tripId !== tripId) return;        // user navigated away meanwhile
  let meta = null, acts = null;
  const apply = () => {
    if (!meta || !acts) return;
    let fresh;
    try {
      fresh = sanitizeTrip(Object.assign({}, meta, { id: tripId, activities: acts }));
    } catch (e) { return; }
    fresh.shared = true;
    fresh.members = meta.members || {};
    const idx = db.trips.findIndex(t => t.id === tripId);
    if (idx >= 0) db.trips[idx] = fresh; else db.trips.push(fresh);
    save();
    if (drag.active || chipDrag.active) return; // don't yank the DOM mid-drag
    if (state.view === "trip" && state.tripId === tripId) {
      const y = window.scrollY;
      render();
      window.scrollTo(0, y);
    } else if (state.view === "trips") {
      render();
    }
  };
  const offMeta = c.fs.onSnapshot(c.fs.doc(c.db, "trips", tripId), snap => {
    if (!snap.exists()) {
      // Deleted by another member.
      detachTripListener();
      const idx = db.trips.findIndex(t => t.id === tripId);
      if (idx >= 0) {
        const name = db.trips[idx].name;
        db.trips.splice(idx, 1);
        save();
        if (state.tripId === tripId) { state.view = "trips"; state.tripId = null; }
        render();
        alert(`Shared trip "${name}" was deleted by a member.`);
      }
      return;
    }
    meta = snap.data();
    apply();
  }, err => console.error("trip listener:", err));
  const offActs = c.fs.onSnapshot(c.fs.collection(c.db, "trips", tripId, "activities"), snap => {
    acts = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
    apply();
  }, err => console.error("activities listener:", err));
  unsubTrip = () => { offMeta(); offActs(); };
}

/* ----- share / join flows ----- */

async function makeSharedFlow(trip) {
  const name = (prompt("Your name (shown to trip members):", "") || "").trim().slice(0, 30) || "Someone";
  try {
    const remoteId = await cloudMakeShared(trip, name);
    // The trip's identity becomes its cloud ID.
    if (state.tripId === trip.id) state.tripId = remoteId;
    trip.id = remoteId;
    trip.shared = true;
    save();
    render();
    if (state.view === "trip" && state.tripId === remoteId) attachTripListener(remoteId);
    inviteTrip(trip);
  } catch (err) {
    alert("Couldn't share the trip: " + err.message);
  }
}

async function inviteTrip(trip) {
  const url = location.origin + location.pathname + "#join=" + trip.id;
  if (navigator.share) {
    try { await navigator.share({ title: trip.name, url }); return; }
    catch (e) { if (e.name === "AbortError") return; }
  }
  try {
    await navigator.clipboard.writeText(url);
    alert("Invite link copied to clipboard.");
  } catch (e) {
    prompt("Copy this invite link:", url);
  }
}

async function joinSharedTrip(tripId) {
  try {
    const c = await cloudInit();
    if (!getTrip(tripId)) {
      const snap = await c.fs.getDoc(c.fs.doc(c.db, "trips", tripId));
      if (!snap.exists()) throw new Error("trip not found — the link may be stale");
      const meta = snap.data();
      if (!confirm(`Join shared trip "${meta.name}"?`)) return;
      const name = (prompt("Your name (shown to trip members):", "") || "").trim().slice(0, 30) || "Someone";
      const t = sanitizeTrip(Object.assign({}, meta, { id: tripId, activities: [] }));
      t.shared = true;
      t.members = meta.members || {};
      t.members[c.uid] = name;
      const f = {};
      f["members." + c.uid] = name;
      cloudCall(() => cloudUpdateTrip(tripId, f));
      db.trips.push(t);
      save();
    }
    state.view = "trip";
    state.tripId = tripId;
    state.selectedDate = null;
    state.tab = "itinerary";
    state.reorderDate = null;
    render();
    attachTripListener(tripId);
  } catch (err) {
    alert("Couldn't join the trip: " + err.message);
  }
}

/* ================= Unified map tab (currently disabled) ================= */
/* The Map tab button is commented out in renderTrip — this code is kept
   ready to re-enable. All located activities on one Leaflet/OSM map:
   pins colored by day and numbered in visit order. Free-text locations
   are geocoded once via OSM's Nominatim (1 req/sec per its usage policy)
   and the coordinates cached on the activity, so they sync and export. */

const DAY_COLORS = ["#2563eb", "#dc2626", "#059669", "#d97706", "#7c3aed",
                    "#0891b2", "#db2777", "#65a30d", "#92400e", "#475569"];

let leafletReady = null;
function loadLeaflet() {
  if (leafletReady) return leafletReady;
  leafletReady = new Promise((resolve, reject) => {
    const css = document.createElement("link");
    css.rel = "stylesheet";
    css.href = "./vendor/leaflet.css";
    document.head.appendChild(css);
    const s = document.createElement("script");
    s.src = "./vendor/leaflet.js";
    s.onload = () => resolve(window.L);
    s.onerror = () => { leafletReady = null; reject(new Error("map library failed to load")); };
    document.head.appendChild(s);
  });
  return leafletReady;
}

function renderMapTabHTML() {
  return `
    <div id="trip-map"></div>
    <div class="map-status" id="map-status">Loading map…</div>
    <div class="map-legend" id="map-legend"></div>
    <div class="map-unlocated" id="map-unlocated"></div>`;
}

// Geocode every located-but-uncached activity, one per second. Results
// (including definitive "not found") are cached on the activity; network
// errors are not cached so they retry next time the tab opens.
async function ensureGeocodes(tripId) {
  const pending = () => {
    const t = getTrip(tripId);
    return t ? t.activities.filter(a => a.location && (!a.geo || a.geo.q !== a.location)) : [];
  };
  const total = pending().length;
  let done = 0;
  while (state.tab === "map" && state.tripId === tripId) {
    const list = pending();
    if (!list.length) return;
    const a = list[0];
    const s = document.getElementById("map-status");
    if (s) s.textContent = `Locating places… ${done + 1}/${total}`;
    let geo;
    try {
      const res = await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" + encodeURIComponent(a.location));
      if (!res.ok) throw new Error("geocoder error " + res.status);
      const arr = await res.json();
      geo = arr.length
        ? { q: a.location, lat: parseFloat(arr[0].lat), lng: parseFloat(arr[0].lon) }
        : { q: a.location, ok: false };
    } catch (e) {
      return; // offline or geocoder down — leave uncached, retry later
    }
    const t = getTrip(tripId);
    const act = t && t.activities.find(x => x.id === a.id);
    if (act && act.location === geo.q) {
      act.geo = geo;
      save();
      if (t.shared) cloudCall(() => cloudUpdateActivity(t.id, act.id, { geo }));
    }
    done++;
    if (pending().length) await new Promise(r => setTimeout(r, 1100));
  }
}

let leafletMap = null;
let mapView = null;       // remembered center/zoom so re-renders don't reset it
let mapViewTripId = null;

async function initTripMap(tripId) {
  try {
    const L = await loadLeaflet();
    await ensureGeocodes(tripId);
    const trip = getTrip(tripId);
    if (!trip || state.view !== "trip" || state.tripId !== tripId || state.tab !== "map") return;
    const el = document.getElementById("trip-map");
    if (!el) return;
    if (leafletMap) { leafletMap.remove(); leafletMap = null; }
    if (mapViewTripId !== tripId) { mapView = null; mapViewTripId = tripId; }

    const days = tripDays(trip);
    const located = [], failed = [], noLocation = [];
    for (const a of trip.activities) {
      if (!a.location) { noLocation.push(a); continue; }
      if (a.geo && typeof a.geo.lat === "number" && a.geo.q === a.location) located.push(a);
      else failed.push(a);
    }

    const map = L.map(el, { zoomControl: true });
    leafletMap = map;
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> · Nominatim',
    }).addTo(map);

    const seen = new Map(); // nudge identical coordinates apart so all pins stay tappable
    const bounds = [];
    const usedDays = new Set();
    for (const a of located) {
      const di = days.indexOf(a.date);
      const color = di >= 0 ? DAY_COLORS[di % DAY_COLORS.length] : "#6b7280";
      usedDays.add(di);
      const dayLocated = trip.activities
        .filter(x => x.date === a.date && x.location && x.geo && typeof x.geo.lat === "number")
        .sort(byDayOrder);
      const n = dayLocated.indexOf(a) + 1;
      const key = a.geo.lat.toFixed(5) + "," + a.geo.lng.toFixed(5);
      const dup = seen.get(key) || 0;
      seen.set(key, dup + 1);
      const lat = a.geo.lat + dup * 0.00018;
      const lng = a.geo.lng + dup * 0.00018;
      const icon = L.divIcon({
        className: "",
        html: `<div class="map-pin" style="background:${color}">${n}</div>`,
        iconSize: [26, 26], iconAnchor: [13, 13], popupAnchor: [0, -14],
      });
      const when = di >= 0
        ? `Day ${di + 1} · ${fmtDate(a.date, { weekday: "short", month: "short", day: "numeric" })}`
        : "Outside trip dates";
      const time = a.startTime ? " · " + fmtTime(a.startTime) : "";
      L.marker([lat, lng], { icon }).addTo(map).bindPopup(
        `<b>${esc(a.title)}</b><br>${when}${time}<br>` +
        `<a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(a.location)}" target="_blank" rel="noopener">Open in Google Maps</a>`);
      bounds.push([lat, lng]);
    }

    if (mapView) map.setView(mapView.center, mapView.zoom);
    else if (bounds.length) map.fitBounds(bounds, { padding: [36, 36] });
    else map.setView([20, 0], 2);
    map.on("moveend", () => { mapView = { center: map.getCenter(), zoom: map.getZoom() }; });

    const legendEl = document.getElementById("map-legend");
    if (legendEl) {
      legendEl.innerHTML = [...usedDays].sort((x, y) => x - y).map(di => di < 0
        ? `<span class="legend-item"><span class="legend-dot" style="background:#6b7280"></span>Other</span>`
        : `<span class="legend-item"><span class="legend-dot" style="background:${DAY_COLORS[di % DAY_COLORS.length]}"></span>Day ${di + 1}</span>`
      ).join("");
    }

    const s = document.getElementById("map-status");
    if (s) s.textContent = located.length ? "" : "No mappable places yet — add locations to activities.";
    const un = document.getElementById("map-unlocated");
    if (un) {
      const bits = [];
      if (failed.length) bits.push("Couldn't locate: " + failed.map(a => esc(a.title)).join(", ") + ". Try a more specific location on those activities.");
      if (noLocation.length) bits.push(noLocation.length + (noLocation.length === 1 ? " activity has" : " activities have") + " no location.");
      un.innerHTML = bits.join("<br>");
    }
  } catch (err) {
    const s = document.getElementById("map-status");
    if (s) s.textContent = "Map unavailable: " + err.message;
  }
}

/* ================= Hold-to-drag reordering ================= */
/* Long-press a card (~250ms without moving) to lift it, drag within its
   day, release to drop. A quick swipe scrolls as usual; the hold is
   cancelled if the finger wanders before the timer fires. */

const drag = {
  timer: null, active: false,
  el: null, wrap: null, ghost: null,
  startX: 0, startY: 0, liftY: 0, clientY: 0,
};
let suppressClick = false;

function blockScrollWhileDragging(e) {
  if (drag.active || chipDrag.active) e.preventDefault();
}

function cancelHold() {
  clearTimeout(drag.timer);
  drag.timer = null;
  drag.el = null;
  drag.wrap = null;
}

function startDrag() {
  drag.timer = null;
  if (!drag.el) return;
  drag.active = true;
  drag.liftY = drag.clientY;
  const rect = drag.el.getBoundingClientRect();
  const ghost = drag.el.cloneNode(true);
  ghost.classList.add("drag-ghost");
  ghost.style.width = rect.width + "px";
  ghost.style.left = rect.left + "px";
  ghost.style.top = rect.top + "px";
  document.body.appendChild(ghost);
  drag.ghost = ghost;
  drag.el.classList.add("drag-src");
  document.addEventListener("touchmove", blockScrollWhileDragging, { passive: false });
  if (navigator.vibrate) navigator.vibrate(10);
  requestAnimationFrame(autoScrollLoop);
}

// The dimmed source card doubles as the live drop preview: it is moved
// within its day container as the pointer crosses card midpoints.
function updateInsertion() {
  const y = drag.clientY;
  let before = null;
  for (const c of drag.wrap.children) {
    if (c === drag.el || !c.classList.contains("activity")) continue;
    const r = c.getBoundingClientRect();
    if (y < r.top + r.height / 2) { before = c; break; }
  }
  if (before) {
    if (before.previousElementSibling !== drag.el) drag.wrap.insertBefore(drag.el, before);
  } else if (drag.wrap.lastElementChild !== drag.el) {
    drag.wrap.appendChild(drag.el);
  }
}

// Keep scrolling when the finger is held near the top/bottom of the screen.
function autoScrollLoop() {
  if (!drag.active) return;
  const margin = 100, y = drag.clientY;
  if (y < margin) window.scrollBy(0, -Math.min(24, (margin - y) / 3));
  else if (y > innerHeight - margin) window.scrollBy(0, Math.min(24, (y - (innerHeight - margin)) / 3));
  updateInsertion();
  requestAnimationFrame(autoScrollLoop);
}

function endDrag() {
  if (drag.timer) { cancelHold(); return; } // released before the hold fired: normal tap
  if (!drag.active) return;
  drag.active = false;
  document.removeEventListener("touchmove", blockScrollWhileDragging);
  drag.ghost.remove();
  drag.ghost = null;
  drag.el.classList.remove("drag-src");

  // Persist the day's DOM order as the manual order.
  const trip = getTrip(state.tripId);
  if (trip) {
    const ids = [...drag.wrap.querySelectorAll(".activity")].map(el => el.dataset.id);
    ids.forEach((id, i) => {
      const a = trip.activities.find(x => x.id === id);
      if (a) a.order = i;
    });
    if (trip.shared) {
      cloudCall(() => cloudBatchUpdate(trip.id, ids.map((id, i) => ({ id, fields: { order: i } }))));
    }
    save();
  }
  drag.el = null;
  drag.wrap = null;

  // The pointerup may still produce a click on the card — swallow it.
  suppressClick = true;
  setTimeout(() => { suppressClick = false; }, 350);

  const y = window.scrollY;
  render();
  window.scrollTo(0, y);
}

/* --- Day-chip drag: hold a day chip, drag left/right to move that
   day's whole plan to a new slot; the days in between shift over. --- */

const ISO_DAY = /^\d{4}-\d{2}-\d{2}$/;
const chipDrag = {
  timer: null, active: false,
  el: null, row: null, ghost: null,
  startX: 0, startY: 0, liftX: 0, clientX: 0,
};

function cancelChipHold() {
  clearTimeout(chipDrag.timer);
  chipDrag.timer = null;
  chipDrag.el = null;
  chipDrag.row = null;
}

function startChipDrag() {
  chipDrag.timer = null;
  if (!chipDrag.el) return;
  chipDrag.active = true;
  chipDrag.liftX = chipDrag.clientX;
  const rect = chipDrag.el.getBoundingClientRect();
  const ghost = chipDrag.el.cloneNode(true);
  ghost.classList.add("drag-ghost");
  ghost.style.width = rect.width + "px";
  ghost.style.left = rect.left + "px";
  ghost.style.top = rect.top + "px";
  document.body.appendChild(ghost);
  chipDrag.ghost = ghost;
  chipDrag.el.classList.add("drag-src");
  document.addEventListener("touchmove", blockScrollWhileDragging, { passive: false });
  if (navigator.vibrate) navigator.vibrate(10);
  requestAnimationFrame(chipAutoScrollLoop);
}

// Only real date chips are valid slots — the dragged chip can never land
// before "All" or after "Other".
function updateChipInsertion() {
  const x = chipDrag.clientX;
  const dateChips = [...chipDrag.row.children]
    .filter(c => c !== chipDrag.el && ISO_DAY.test(c.dataset.date || ""));
  if (!dateChips.length) return;
  let before = null;
  for (const c of dateChips) {
    const r = c.getBoundingClientRect();
    if (x < r.left + r.width / 2) { before = c; break; }
  }
  if (before) {
    if (before.previousElementSibling !== chipDrag.el) chipDrag.row.insertBefore(chipDrag.el, before);
  } else {
    const last = dateChips[dateChips.length - 1];
    if (chipDrag.el.previousElementSibling !== last) chipDrag.row.insertBefore(chipDrag.el, last.nextSibling);
  }
}

// Nudge the chip row sideways when dragging near its edges.
function chipAutoScrollLoop() {
  if (!chipDrag.active) return;
  const r = chipDrag.row.getBoundingClientRect();
  const x = chipDrag.clientX, m = 60;
  if (x < r.left + m) chipDrag.row.scrollLeft -= Math.min(20, (r.left + m - x) / 3);
  else if (x > r.right - m) chipDrag.row.scrollLeft += Math.min(20, (x - (r.right - m)) / 3);
  updateChipInsertion();
  requestAnimationFrame(chipAutoScrollLoop);
}

function endChipDrag() {
  if (chipDrag.timer) { cancelChipHold(); return; }
  if (!chipDrag.active) return;
  chipDrag.active = false;
  document.removeEventListener("touchmove", blockScrollWhileDragging);
  chipDrag.ghost.remove();
  chipDrag.ghost = null;
  chipDrag.el.classList.remove("drag-src");

  const trip = getTrip(state.tripId);
  if (trip) {
    const order = [...chipDrag.row.querySelectorAll(".chip")]
      .map(c => c.dataset.date)
      .filter(d => ISO_DAY.test(d || ""));
    const landed = tripDays(trip)[order.indexOf(chipDrag.el.dataset.date)];
    reorderDays(trip, order);
    suppressClick = true;
    setTimeout(() => { suppressClick = false; }, 350);
    // Show where the dragged plan ended up.
    if (state.selectedDate === "all") {
      const y = window.scrollY;
      render();
      window.scrollTo(0, y);
      scrollToDay(landed, true);
    } else {
      state.selectedDate = landed;
      render();
    }
  }
  chipDrag.el = null;
  chipDrag.row = null;
}

/* --- shared pointer wiring for both drags --- */

$app.addEventListener("pointerdown", e => {
  if (e.button !== 0) return;
  if (e.target.closest("a,button")) return; // links/buttons keep their own gestures

  const chip = e.target.closest(".chip");
  if (chip && ISO_DAY.test(chip.dataset.date || "") && chip.parentElement.classList.contains("day-chips")) {
    chipDrag.el = chip;
    chipDrag.row = chip.parentElement;
    chipDrag.startX = e.clientX;
    chipDrag.startY = e.clientY;
    chipDrag.clientX = e.clientX;
    chipDrag.timer = setTimeout(startChipDrag, 250);
    return;
  }

  const card = e.target.closest(".activity");
  const wrap = card && card.parentElement;
  if (!card || !wrap || !wrap.classList.contains("day-cards")) return;
  drag.el = card;
  drag.wrap = wrap;
  drag.startX = e.clientX;
  drag.startY = e.clientY;
  drag.clientY = e.clientY;
  drag.timer = setTimeout(startDrag, 250);
});

document.addEventListener("pointermove", e => {
  drag.clientY = e.clientY;
  chipDrag.clientX = e.clientX;

  if (drag.timer && !drag.active) {
    // finger wandered before the hold fired: it's a scroll, not a drag
    if (Math.hypot(e.clientX - drag.startX, e.clientY - drag.startY) > 8) cancelHold();
  } else if (drag.active) {
    drag.ghost.style.transform = `translateY(${e.clientY - drag.liftY}px) scale(1.02)`;
    updateInsertion();
  }

  if (chipDrag.timer && !chipDrag.active) {
    if (Math.hypot(e.clientX - chipDrag.startX, e.clientY - chipDrag.startY) > 8) cancelChipHold();
  } else if (chipDrag.active) {
    chipDrag.ghost.style.transform = `translateX(${e.clientX - chipDrag.liftX}px) scale(1.05)`;
    updateChipInsertion();
  }
});

document.addEventListener("pointerup", () => { endDrag(); endChipDrag(); });
document.addEventListener("pointercancel", () => { endDrag(); endChipDrag(); });
$app.addEventListener("contextmenu", e => {
  if (drag.active || drag.timer || chipDrag.active || chipDrag.timer) e.preventDefault();
});

/* ================= Click handling ================= */

document.addEventListener("click", e => {
  // A click generated by the tail end of a drag is not a tap.
  if (suppressClick) { suppressClick = false; return; }

  // Let real links (e.g. map links inside activity cards) navigate
  // without also triggering the card's action.
  if (e.target.closest("a[href]")) return;

  // Tap on the modal backdrop closes it.
  if (e.target === $modal) { closeModal(); return; }

  const el = e.target.closest("[data-action]");
  if (!el) return;
  const trip = getTrip(state.tripId);

  switch (el.dataset.action) {
    case "new-trip":
      openTripForm(null);
      break;
    case "open-trip": {
      state.view = "trip";
      state.tripId = el.dataset.id;
      state.selectedDate = null;
      state.tab = "itinerary";
      state.reorderDate = null;
      const opened = getTrip(state.tripId);
      if (opened && opened.shared) attachTripListener(opened.id);
      else detachTripListener();
      render();
      break;
    }
    case "set-tab":
      state.tab = el.dataset.tab;
      render();
      break;
    case "edit-trip":
      openTripForm(getTrip(el.dataset.id));
      break;
    case "delete-trip": {
      const t = getTrip(el.dataset.id);
      const msg = t && (t.shared
        ? `Delete "${t.name}" for EVERYONE? All members lose it. To only remove it from this device, use "Leave Trip" instead.`
        : `Delete "${t.name}" and all its activities?`);
      if (t && confirm(msg)) {
        if (t.shared) { detachTripListener(); cloudCall(() => cloudDeleteTrip(t.id)); }
        db.trips = db.trips.filter(x => x.id !== t.id);
        state.view = "trips";
        save(); closeModal(); render();
      }
      break;
    }
    case "leave-trip": {
      const t = getTrip(el.dataset.id);
      if (t && confirm(`Remove "${t.name}" from this device? Other members keep it, and you can rejoin later with an invite link.`)) {
        detachTripListener();
        db.trips = db.trips.filter(x => x.id !== t.id);
        state.view = "trips";
        save(); closeModal(); render();
      }
      break;
    }
    case "make-shared": {
      const t = getTrip(el.dataset.id);
      if (t) { closeModal(); makeSharedFlow(t); }
      break;
    }
    case "invite-trip": {
      const t = getTrip(el.dataset.id);
      if (t) inviteTrip(t);
      break;
    }
    case "back":
      state.view = "trips";
      state.tripId = null;
      state.reorderDate = null;
      detachTripListener();
      render();
      break;
    case "select-day": {
      const d = el.dataset.date;
      if (state.selectedDate === "all" && d !== "all") {
        scrollToDay(d, true); // in overview, day chips jump-scroll
      } else if (d === "all" && state.selectedDate === "all") {
        state.selectedDate = null; // tap All again to go back to one day
        render();
      } else {
        state.selectedDate = d;
        render();
      }
      break;
    }
    case "toggle-map": {
      // Inject/remove the map iframe in place — no re-render, so the page
      // doesn't jump and the map stays put while you scroll the day.
      const wrap = el.parentElement;
      const open = wrap.querySelector("iframe");
      if (open) {
        open.remove();
        el.setAttribute("aria-expanded", "false");
        el.textContent = "🗺️ " + el.dataset.label;
      } else {
        const frame = document.createElement("iframe");
        frame.className = "day-map-frame";
        frame.loading = "lazy";
        frame.referrerPolicy = "no-referrer-when-downgrade";
        frame.setAttribute("allowfullscreen", "");
        frame.src = el.dataset.src;
        wrap.appendChild(frame);
        el.setAttribute("aria-expanded", "true");
        el.textContent = "🗺️ Hide map";
      }
      break;
    }
    case "add-activity":
      if (trip) openActivityForm(trip, null, el.dataset.date);
      break;
    case "toggle-reorder": {
      state.reorderDate = state.reorderDate === el.dataset.date ? null : el.dataset.date;
      const y = window.scrollY;
      render();
      window.scrollTo(0, y);
      break;
    }
    case "move-act": {
      if (!trip) break;
      moveActivity(trip, el.dataset.id, el.dataset.dir);
      const y = window.scrollY;
      render();
      window.scrollTo(0, y);
      break;
    }
    case "edit-activity": {
      if (!trip) break;
      const a = trip.activities.find(x => x.id === el.dataset.id);
      if (a && a.date === state.reorderDate) break; // card taps are inert while reordering that day
      openActivityForm(trip, a);
      break;
    }
    case "delete-activity": {
      if (!trip) break;
      const a = trip.activities.find(x => x.id === el.dataset.id);
      if (a && confirm(`Delete "${a.title}"?`)) {
        trip.activities = trip.activities.filter(x => x.id !== a.id);
        if (trip.shared) cloudCall(() => cloudDeleteActivity(trip.id, a.id));
        const y = window.scrollY;
        save(); closeModal(); render();
        window.scrollTo(0, y);
      }
      break;
    }
    case "export-trip": {
      const t = getTrip(el.dataset.id);
      if (t) exportTrip(t);
      break;
    }
    case "share-trip": {
      const t = getTrip(el.dataset.id);
      if (t) shareTrip(t);
      break;
    }
    case "import-trip":
      document.getElementById("import-file").click();
      break;
    case "close-modal":
      closeModal();
      break;
  }
});

/* ================= Import file handling ================= */

document.getElementById("import-file").addEventListener("change", async e => {
  const file = e.target.files[0];
  e.target.value = ""; // allow picking the same file again later
  if (!file) return;
  try {
    importTripFromData(JSON.parse(await file.text()));
  } catch (err) {
    alert("Couldn't import: " + (err instanceof SyntaxError ? "this isn't a valid JSON file" : err.message));
  }
});

render();
handleSharedLink();

/* ================= PWA ================= */

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("./sw.js").catch(() => {});
}
</script>
