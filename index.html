<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Trips">
<title>Trip Manager</title>
<style>
  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --text: #1b1f24;
    --text-dim: #6b7280;
    --accent: #2563eb;
    --accent-soft: #dbeafe;
    --border: #e5e7eb;
    --danger: #dc2626;
    --warn: #d97706;
    --shadow: 0 1px 3px rgba(0,0,0,.08);
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101318;
      --surface: #1a1f27;
      --text: #e8eaed;
      --text-dim: #9aa3af;
      --accent: #60a5fa;
      --accent-soft: #1e3a5f;
      --border: #2a313c;
      --danger: #f87171;
      --warn: #fbbf24;
      --shadow: 0 1px 3px rgba(0,0,0,.4);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: env(safe-area-inset-bottom);
    min-height: 100vh;
  }

  /* ---------- Header ---------- */
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
    display: flex; align-items: center; gap: 10px;
  }
  header h1 {
    font-size: 18px; font-weight: 700; margin: 0;
    flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .icon-btn {
    background: none; border: none; color: var(--accent);
    font-size: 16px; font-weight: 600; cursor: pointer;
    padding: 6px 8px; border-radius: 8px; flex-shrink: 0;
  }
  .icon-btn:active { background: var(--accent-soft); }

  main { padding: 16px; max-width: 640px; margin: 0 auto; }

  /* ---------- Cards & lists ---------- */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 14px 16px;
    margin-bottom: 12px;
    cursor: pointer;
  }
  .card:active { opacity: .85; }
  .card h2 { margin: 0 0 2px; font-size: 17px; }
  .card .sub { color: var(--text-dim); font-size: 14px; margin: 0; }
  .card .stats { display: flex; gap: 14px; margin-top: 8px; font-size: 13px; color: var(--text-dim); }

  .empty {
    text-align: center; color: var(--text-dim);
    padding: 48px 24px; font-size: 15px; line-height: 1.6;
  }
  .empty .big { font-size: 44px; display: block; margin-bottom: 8px; }

  .btn {
    display: block; width: 100%;
    background: var(--accent); color: #fff;
    border: none; border-radius: var(--radius);
    padding: 14px; font-size: 16px; font-weight: 600;
    cursor: pointer; margin-top: 4px;
  }
  .btn:active { opacity: .85; }
  .btn.secondary {
    background: var(--surface); color: var(--accent);
    border: 1px solid var(--border);
  }
  .btn.danger { background: none; color: var(--danger); border: none; font-weight: 500; }

  /* ---------- Trip view ---------- */
  .trip-sub {
    color: var(--text-dim); font-size: 14px;
    margin: -6px 0 14px; text-align: center;
  }
  .day-chips {
    display: flex; gap: 8px; overflow-x: auto;
    padding: 8px 16px 12px; margin: 0 -16px;
    -webkit-overflow-scrolling: touch; scrollbar-width: none;
    position: sticky; top: calc(52px + env(safe-area-inset-top)); z-index: 5;
    background: var(--bg);
  }
  .day-chips::-webkit-scrollbar { display: none; }
  .chip {
    flex-shrink: 0; text-align: center;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 8px 14px; cursor: pointer;
    font-size: 13px; color: var(--text-dim); line-height: 1.3;
  }
  .chip b { display: block; font-size: 15px; color: var(--text); }
  .chip.selected { background: var(--accent); border-color: var(--accent); }
  .chip.selected b, .chip.selected { color: #fff; }

  .day-heading {
    font-size: 14px; font-weight: 600; color: var(--text-dim);
    margin: 6px 2px 10px;
    display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
  }
  .day-section { scroll-margin-top: calc(144px + env(safe-area-inset-top)); margin-bottom: 18px; }
  .mini-add {
    border: none; background: none; color: var(--accent);
    font-weight: 600; font-size: 13px; font-family: inherit;
    cursor: pointer; padding: 2px 4px; flex-shrink: 0;
  }
  .day-empty { color: var(--text-dim); font-size: 14px; margin: 0 2px 10px; }
  .day-actions { display: flex; gap: 12px; flex-shrink: 0; }
  .act-move { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
  .move-btn {
    width: 42px; height: 34px;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--bg); color: var(--accent);
    font-size: 14px; cursor: pointer;
  }
  .move-btn:disabled { opacity: .3; }
  .del-btn {
    width: 42px; height: 34px; flex-shrink: 0;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--bg); color: var(--danger);
    font-size: 14px; cursor: pointer; align-self: center;
  }

  /* ---------- Hold-to-drag reordering ---------- */
  .activity { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  .drag-ghost {
    position: fixed; z-index: 100; pointer-events: none;
    margin: 0; opacity: .95;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .28);
    transform: scale(1.02);
  }
  .drag-src { opacity: .35; }

  /* ---------- Activities ---------- */
  .activity {
    display: flex; gap: 12px; align-items: flex-start;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 12px 14px; margin-bottom: 10px; cursor: pointer;
  }
  .activity:active { opacity: .85; }
  .act-time {
    flex-shrink: 0; width: 62px;
    font-size: 13px; font-weight: 600; color: var(--accent);
    line-height: 1.4; padding-top: 2px;
  }
  .act-time .end { color: var(--text-dim); font-weight: 400; display: block; }
  .act-main { flex: 1; min-width: 0; }
  .act-title { font-size: 15px; font-weight: 600; margin: 0; }
  .act-meta { font-size: 13px; color: var(--text-dim); margin-top: 3px; overflow-wrap: break-word; }
  .act-notes { font-size: 13px; color: var(--text-dim); margin-top: 4px; white-space: pre-wrap; }
  .act-cost { flex-shrink: 0; font-size: 14px; font-weight: 600; padding-top: 2px; }

  .day-total {
    text-align: right; font-size: 14px; color: var(--text-dim);
    margin: 4px 4px 14px;
  }
  .day-total b { color: var(--text); }

  .map-link { color: var(--accent); text-decoration: none; }
  .map-link:active { text-decoration: underline; }

  /* ---------- Per-day map ---------- */
  .day-map { margin: 2px 2px 16px; }
  .map-toggle {
    display: block; width: 100%; text-align: left;
    background: var(--surface); border: 1px solid var(--border);
    color: var(--accent); font-weight: 600; font-size: 13px; font-family: inherit;
    cursor: pointer; padding: 10px 12px; border-radius: 10px;
  }
  .map-toggle:active { background: var(--accent-soft); }
  .map-toggle[aria-expanded="true"] { border-radius: 10px 10px 0 0; }
  .day-map-frame {
    display: block; width: 100%; height: 280px; border: 0;
    border: 1px solid var(--border); border-top: none;
    border-radius: 0 0 10px 10px; background: var(--bg);
  }

  /* ---------- Tabs (Itinerary | Budget) ---------- */
  .tabs {
    display: flex; gap: 2px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 3px; margin-bottom: 14px;
  }
  .tabs button {
    flex: 1; border: none; background: none; cursor: pointer;
    padding: 8px; font-size: 14px; font-weight: 600; font-family: inherit;
    color: var(--text-dim); border-radius: 9px;
  }
  .tabs button.selected { background: var(--accent); color: #fff; }

  /* ---------- Budget screen ---------- */
  .budget-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 18px 16px; margin-bottom: 6px;
  }
  .hero-label { font-size: 13px; font-weight: 600; color: var(--text-dim); margin: 0 0 4px; }
  .hero-value { font-size: 48px; font-weight: 600; line-height: 1.1; margin: 0; overflow-wrap: break-word; }
  .hero-sub { font-size: 14px; color: var(--text-dim); margin: 8px 0 0; }
  .meter { height: 10px; border-radius: 5px; background: var(--accent-soft); margin-top: 16px; overflow: hidden; }
  .meter-fill { height: 100%; background: var(--accent); border-radius: 0 5px 5px 0; }
  .meter-fill.warn { background: var(--warn); }
  .meter-fill.over { background: var(--danger); }

  .section-title { font-size: 14px; font-weight: 700; margin: 20px 2px 6px; }
  .brk-row {
    display: grid; grid-template-columns: minmax(100px, 36%) 1fr auto;
    gap: 10px; align-items: center;
    padding: 7px 2px; font-size: 14px;
  }
  .brk-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .brk-label .sub { color: var(--text-dim); }
  .brk-bar { height: 8px; border-radius: 0 4px 4px 0; background: var(--accent); min-width: 2px; }
  .brk-val { font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; }
  .brk-val.zero { color: var(--text-dim); font-weight: 400; }

  /* ---------- Modal (bottom sheet) ---------- */
  #modal {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(0,0,0,.45);
    display: none; align-items: flex-end; justify-content: center;
  }
  #modal.open { display: flex; }
  .sheet {
    background: var(--surface);
    border-radius: 20px 20px 0 0;
    width: 100%; max-width: 640px;
    max-height: 88vh; overflow-y: auto;
    padding: 20px 20px calc(24px + env(safe-area-inset-bottom));
    animation: slideUp .22s ease-out;
  }
  @keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  .sheet h3 { margin: 0 0 16px; font-size: 18px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; font-weight: 600; color: var(--text-dim); margin-bottom: 5px; }
  .field input, .field select, .field textarea {
    width: 100%; padding: 11px 12px;
    font-size: 16px; font-family: inherit;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    appearance: none; -webkit-appearance: none;
  }
  .field textarea { resize: vertical; min-height: 64px; }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; min-width: 0; }
</style>
</head>
<body>

<header>
  <button class="icon-btn" id="back-btn" data-action="back" hidden>‹ Trips</button>
  <h1 id="header-title">Trip Manager</h1>
  <button class="icon-btn" id="header-action" hidden></button>
</header>

<main id="app"></main>

<div id="modal"></div>
<input type="file" id="import-file" accept=".json,application/json" hidden>

<script>
"use strict";

/* ================= Data layer ================= */

const STORE_KEY = "tripManager.v1";

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      if (data && Array.isArray(data.trips)) return data;
    }
  } catch (e) { /* corrupted storage: start fresh */ }
  return { trips: [] };
}

function save() {
  localStorage.setItem(STORE_KEY, JSON.stringify(db));
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

const db = load();

const CATEGORIES = [
  ["food",        "🍽️", "Food & drink"],
  ["sightseeing", "🏛️", "Sightseeing"],
  ["transport",   "🚆", "Transport"],
  ["lodging",     "🏨", "Lodging"],
  ["activity",    "🎟️", "Activity"],
  ["shopping",    "🛍️", "Shopping"],
  ["other",       "📌", "Other"],
];

function categoryLabel(key) {
  const c = CATEGORIES.find(c => c[0] === key) || CATEGORIES[CATEGORIES.length - 1];
  return c[1] + " " + c[2];
}

/* ================= Helpers ================= */

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

// Parse "YYYY-MM-DD" as a local date (avoids UTC off-by-one).
function parseDate(s) {
  const [y, m, d] = s.split("-").map(Number);
  return new Date(y, m - 1, d);
}

function toISO(d) {
  return d.getFullYear() + "-" +
    String(d.getMonth() + 1).padStart(2, "0") + "-" +
    String(d.getDate()).padStart(2, "0");
}

function fmtDate(iso, opts) {
  return parseDate(iso).toLocaleDateString(undefined, opts);
}

function fmtRange(a, b) {
  const sameYear = a.slice(0, 4) === b.slice(0, 4);
  const start = fmtDate(a, { month: "short", day: "numeric", year: sameYear ? undefined : "numeric" });
  const end = fmtDate(b, { month: "short", day: "numeric", year: "numeric" });
  return start + " – " + end;
}

function fmtTime(hhmm) {
  if (!hhmm) return "";
  const [h, m] = hhmm.split(":").map(Number);
  return new Date(2000, 0, 1, h, m).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
}

function fmtMoney(n, currency) {
  return (currency || "$") + Number(n).toLocaleString(undefined, { maximumFractionDigits: 2 });
}

function getTrip(id) {
  return db.trips.find(t => t.id === id);
}

// All dates in the trip's range, capped defensively at 120 days.
function tripDays(trip) {
  const days = [];
  const d = parseDate(trip.startDate);
  const end = parseDate(trip.endDate);
  while (d <= end && days.length < 120) {
    days.push(toISO(d));
    d.setDate(d.getDate() + 1);
  }
  return days;
}

function tripTotalCost(trip) {
  return trip.activities.reduce((sum, a) => sum + (a.cost || 0), 0);
}

/* ================= Export / import ================= */

function slugify(s) {
  return s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "trip";
}

function exportTrip(trip) {
  const data = { app: "trip-manager", version: 1, trip };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = slugify(trip.name) + ".json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// Validate and normalize an imported trip. Throws with a readable
// message on anything that doesn't look like a trip; silently drops
// malformed activities and unknown fields.
function sanitizeTrip(raw) {
  if (!raw || typeof raw !== "object") throw new Error("this file doesn't contain a trip");
  const isDate = s => typeof s === "string" && /^\d{4}-\d{2}-\d{2}$/.test(s);
  const isTime = s => typeof s === "string" && /^([01]?\d|2[0-3]):[0-5]\d$/.test(s);
  if (typeof raw.name !== "string" || !raw.name.trim()) throw new Error("the trip has no name");
  if (!isDate(raw.startDate) || !isDate(raw.endDate)) throw new Error("the trip dates are missing or invalid");

  const trip = {
    id: typeof raw.id === "string" ? raw.id : uid(),
    name: raw.name.trim().slice(0, 80),
    destination: typeof raw.destination === "string" ? raw.destination.trim().slice(0, 80) : "",
    startDate: raw.startDate,
    endDate: raw.endDate,
    currency: (typeof raw.currency === "string" && raw.currency.trim()) ? raw.currency.trim().slice(0, 5) : "$",
    budget: (typeof raw.budget === "number" && isFinite(raw.budget) && raw.budget > 0) ? raw.budget : null,
    activities: [],
  };
  if (trip.endDate < trip.startDate) [trip.startDate, trip.endDate] = [trip.endDate, trip.startDate];

  for (const a of Array.isArray(raw.activities) ? raw.activities : []) {
    if (!a || typeof a !== "object") continue;
    if (typeof a.title !== "string" || !a.title.trim() || !isDate(a.date)) continue;
    trip.activities.push({
      id: typeof a.id === "string" ? a.id : uid(),
      title: a.title.trim().slice(0, 120),
      date: a.date,
      startTime: isTime(a.startTime) ? a.startTime : "",
      endTime: isTime(a.endTime) ? a.endTime : "",
      category: CATEGORIES.some(c => c[0] === a.category) ? a.category : "other",
      location: typeof a.location === "string" ? a.location.trim().slice(0, 160) : "",
      cost: (typeof a.cost === "number" && isFinite(a.cost) && a.cost >= 0) ? a.cost : null,
      order: (typeof a.order === "number" && isFinite(a.order)) ? a.order : null,
      notes: typeof a.notes === "string" ? a.notes.trim().slice(0, 1000) : "",
    });
  }
  return trip;
}

/* ---- Share by link: trip JSON, deflated, base64url, in the URL hash.
   The hash is never sent to the server, so shared trips stay private. ---- */

function b64url(bytes) {
  let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000)
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}

function unb64url(s) {
  const bin = atob(s.replace(/-/g, "+").replace(/_/g, "/"));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

// "z:" = deflate-compressed, "j:" = plain JSON (fallback for old browsers).
async function encodeShare(str) {
  const bytes = new TextEncoder().encode(str);
  if (typeof CompressionStream === "undefined") return "j:" + b64url(bytes);
  const stream = new Blob([bytes]).stream().pipeThrough(new CompressionStream("deflate-raw"));
  return "z:" + b64url(new Uint8Array(await new Response(stream).arrayBuffer()));
}

async function decodeShare(payload) {
  const kind = payload.slice(0, 2), bytes = unb64url(payload.slice(2));
  if (kind === "j:") return new TextDecoder().decode(bytes);
  if (kind === "z:") {
    if (typeof DecompressionStream === "undefined")
      throw new Error("this browser can't open compressed trip links — ask for the file export instead");
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    return new Response(stream).text();
  }
  throw new Error("unrecognized link format");
}

async function shareTrip(trip) {
  const payload = await encodeShare(JSON.stringify({ app: "trip-manager", version: 1, trip }));
  const url = location.origin + location.pathname + "#trip=" + payload;
  if (navigator.share) {
    try { await navigator.share({ title: trip.name, url }); return; }
    catch (e) { if (e.name === "AbortError") return; /* else fall through to clipboard */ }
  }
  try {
    await navigator.clipboard.writeText(url);
    alert("Share link copied to clipboard.");
  } catch (e) {
    prompt("Copy this link:", url);
  }
}

async function handleSharedLink() {
  const m = location.hash.match(/^#trip=(.+)$/);
  if (!m) return;
  // Clear the hash first so refresh/back doesn't re-prompt.
  history.replaceState(null, "", location.pathname + location.search);
  try {
    const data = JSON.parse(await decodeShare(decodeURIComponent(m[1])));
    const trip = sanitizeTrip(data && data.trip ? data.trip : data);
    if (confirm(`Import shared trip "${trip.name}" (${trip.activities.length} activities)?`)) {
      importTripFromData(trip);
    }
  } catch (err) {
    alert("Couldn't open shared trip link: " + err.message);
  }
}

function importTripFromData(data) {
  const trip = sanitizeTrip(data && data.trip ? data.trip : data);
  const existingIdx = db.trips.findIndex(t => t.id === trip.id);
  if (existingIdx >= 0) {
    const replace = confirm(
      `"${db.trips[existingIdx].name}" already exists here.\n\nOK = replace it with the imported version\nCancel = keep both (import as a copy)`);
    if (replace) {
      db.trips[existingIdx] = trip;
    } else {
      trip.id = uid();
      trip.name = (trip.name + " (copy)").slice(0, 80);
      db.trips.push(trip);
    }
  } else {
    db.trips.push(trip);
  }
  state.view = "trip";
  state.tripId = trip.id;
  state.selectedDate = null;
  save();
  render();
}

/* ================= State & rendering ================= */

const state = { view: "trips", tripId: null, selectedDate: null, tab: "itinerary", reorderDate: null };

const $app = document.getElementById("app");
const $title = document.getElementById("header-title");
const $back = document.getElementById("back-btn");
const $headerAction = document.getElementById("header-action");

function render() {
  if (state.view === "trip" && getTrip(state.tripId)) renderTrip();
  else renderTrips();
  window.scrollTo(0, 0);
}

/* ----- Trips list ----- */

function renderTrips() {
  state.view = "trips";
  $title.textContent = "Trip Manager";
  $back.hidden = true;
  $headerAction.hidden = true;

  let html = "";
  if (db.trips.length === 0) {
    html += `<div class="empty"><span class="big">✈️</span>
      No trips yet.<br>Create your first one to start planning.</div>`;
  } else {
    const sorted = [...db.trips].sort((a, b) => a.startDate.localeCompare(b.startDate));
    for (const t of sorted) {
      const total = tripTotalCost(t);
      html += `
      <div class="card" data-action="open-trip" data-id="${t.id}">
        <h2>${esc(t.name)}</h2>
        <p class="sub">${esc(t.destination)} · ${fmtRange(t.startDate, t.endDate)}</p>
        <div class="stats">
          <span>${tripDays(t).length} days</span>
          <span>${t.activities.length} activities</span>
          ${total ? `<span>${fmtMoney(total, t.currency)}</span>` : ""}
        </div>
      </div>`;
    }
  }
  html += `<button class="btn" data-action="new-trip">+ New Trip</button>
    <button class="btn secondary" data-action="import-trip">⤓ Import Trip</button>`;
  $app.innerHTML = html;
}

/* ----- Single trip ----- */

const byStartTime = (a, b) => (a.startTime || "99:99").localeCompare(b.startTime || "99:99");

// Display order within a day: manual order (if set) wins; otherwise by time.
// A day starts with no manual orders (pure time sort); the first arrow tap
// freezes the visual order into explicit indexes, which then stick.
const ord = a => (Number.isFinite(a.order) ? a.order : 1e9);
const byDayOrder = (a, b) => (ord(a) - ord(b)) || byStartTime(a, b);

function moveActivity(trip, id, dir) {
  const act = trip.activities.find(a => a.id === id);
  if (!act) return;
  const dayList = trip.activities.filter(a => a.date === act.date).sort(byDayOrder);
  const idx = dayList.indexOf(act);
  const target = idx + (dir === "up" ? -1 : 1);
  if (target < 0 || target >= dayList.length) return;
  dayList.forEach((a, i) => { a.order = i; }); // freeze current visual order
  dayList[idx].order = target;
  dayList[target].order = idx;
  save();
}

// Ordered list of a day's stop locations, in display order (manual order
// wins over times), dropping blanks and collapsing consecutive repeats.
function dayLocations(acts) {
  const locs = [];
  for (const a of [...acts].sort(byDayOrder)) {
    const loc = (a.location || "").trim();
    if (loc && loc !== locs[locs.length - 1]) locs.push(loc);
  }
  return locs;
}

// Keyless Google Maps embed for a day: a single place gets a search embed,
// two or more become a route through the stops in order (saddr + "to:" chain).
function mapEmbedSrc(locs) {
  if (locs.length === 0) return null;
  if (locs.length === 1) {
    return "https://maps.google.com/maps?output=embed&q=" + encodeURIComponent(locs[0]);
  }
  const saddr = encodeURIComponent(locs[0]);
  const daddr = locs.slice(1).map(encodeURIComponent).join("+to:");
  return "https://maps.google.com/maps?output=embed&saddr=" + saddr + "&daddr=" + daddr;
}

// A collapsible map for one day. Returns "" when the day has no locations.
// The iframe is injected lazily on tap (see the "toggle-map" handler) so an
// all-days overview doesn't spin up a dozen maps at once.
function mapSectionHTML(acts, key) {
  const locs = dayLocations(acts);
  const src = mapEmbedSrc(locs);
  if (!src) return "";
  const label = locs.length === 1 ? "Show place on map" : `Show ${locs.length} stops on map`;
  return `
  <div class="day-map" id="map-${esc(key)}">
    <button class="map-toggle" data-action="toggle-map"
      data-src="${esc(src)}" data-label="${esc(label)}" aria-expanded="false">🗺️ ${esc(label)}</button>
  </div>`;
}

function activityCardHTML(trip, a, reorder, isFirst, isLast) {
  const mapLink = a.location
    ? `<a class="map-link" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(a.location)}"
         target="_blank" rel="noopener">📍 ${esc(a.location)}</a>`
    : "";
  const meta = [categoryLabel(a.category), mapLink].filter(Boolean).join(" · ");
  const tail = reorder
    ? `<div class="act-move">
         <button class="move-btn" data-action="move-act" data-id="${a.id}" data-dir="up" ${isFirst ? "disabled" : ""}>▲</button>
         <button class="move-btn" data-action="move-act" data-id="${a.id}" data-dir="down" ${isLast ? "disabled" : ""}>▼</button>
       </div>`
    : (a.cost ? `<div class="act-cost">${fmtMoney(a.cost, trip.currency)}</div>` : "");
  const lead = reorder
    ? `<button class="del-btn" data-action="delete-activity" data-id="${a.id}">🗑</button>`
    : `<div class="act-time">${a.startTime ? fmtTime(a.startTime) : "—"}
        ${a.endTime ? `<span class="end">– ${fmtTime(a.endTime)}</span>` : ""}
      </div>`;
  return `
  <div class="activity" data-action="edit-activity" data-id="${a.id}">
    ${lead}
    <div class="act-main">
      <p class="act-title">${esc(a.title)}</p>
      <div class="act-meta">${meta}</div>
      ${a.notes ? `<div class="act-notes">${esc(a.notes)}</div>` : ""}
    </div>
    ${tail}
  </div>`;
}

function daySectionHTML(trip, d, i) {
  const acts = trip.activities.filter(a => a.date === d).sort(byDayOrder);
  const total = acts.reduce((s, a) => s + (a.cost || 0), 0);
  const reordering = state.reorderDate === d;
  return `
  <section class="day-section" id="day-${d}">
    <div class="day-heading">
      <span>${fmtDate(d, { weekday: "long", month: "long", day: "numeric" })} · Day ${i + 1}</span>
      <span class="day-actions">
        ${acts.length ? `<button class="mini-add" data-action="toggle-reorder" data-date="${d}">${reordering ? "✓ Done" : "✎ Edit"}</button>` : ""}
        <button class="mini-add" data-action="add-activity" data-date="${d}">+ Add</button>
      </span>
    </div>
    <div class="day-cards" data-date="${d}">
      ${acts.map((a, k) => activityCardHTML(trip, a, reordering, k === 0, k === acts.length - 1)).join("") || `<div class="day-empty">Nothing planned.</div>`}
    </div>
    ${total ? `<div class="day-total">Day total: <b>${fmtMoney(total, trip.currency)}</b></div>` : ""}
    ${mapSectionHTML(acts, d)}
  </section>`;
}

function orphanSectionHTML(trip, orphans) {
  return `
  <section class="day-section" id="day-other">
    <div class="day-heading"><span>⚠️ Outside trip dates — edit to pick a day</span></div>
    ${[...orphans].sort(byStartTime).map(a => activityCardHTML(trip, a)).join("")}
    ${mapSectionHTML(orphans, "other")}
  </section>`;
}

function scrollToDay(date, smooth) {
  const sec = document.getElementById("day-" + date) || document.getElementById("day-other");
  if (sec) sec.scrollIntoView({ behavior: smooth ? "smooth" : "auto", block: "start" });
}

function renderTrip() {
  const trip = getTrip(state.tripId);
  state.view = "trip";
  $title.textContent = trip.name;
  $back.hidden = false;
  $headerAction.hidden = false;
  $headerAction.textContent = "Edit";
  $headerAction.dataset.action = "edit-trip";
  $headerAction.dataset.id = trip.id;

  const days = tripDays(trip);
  const orphans = trip.activities.filter(a => !days.includes(a.date));

  // Default selected day: today if in range, else first day.
  const today = toISO(new Date());
  if (!days.includes(state.selectedDate) && state.selectedDate !== "other" && state.selectedDate !== "all") {
    state.selectedDate = days.includes(today) ? today : days[0];
  }
  if (state.selectedDate === "other" && orphans.length === 0) {
    state.selectedDate = days[0];
  }

  let chips = `<div class="chip${state.selectedDate === "all" ? " selected" : ""}"
    data-action="select-day" data-date="all">☰<b>All</b>${days.length} days</div>`;
  days.forEach((d, i) => {
    const sel = d === state.selectedDate ? " selected" : "";
    chips += `<div class="chip${sel}" data-action="select-day" data-date="${d}">
      ${fmtDate(d, { weekday: "short" })}<b>${parseDate(d).getDate()}</b>Day ${i + 1}
    </div>`;
  });
  if (orphans.length) {
    const sel = state.selectedDate === "other" ? " selected" : "";
    chips += `<div class="chip${sel}" data-action="select-day" data-date="other">⚠️<b>${orphans.length}</b>Other</div>`;
  }

  let itinerary;
  if (state.selectedDate === "all") {
    // Overview: every day in sequence; chips act as jump-links.
    itinerary =
      days.map((d, i) => daySectionHTML(trip, d, i)).join("") +
      (orphans.length ? orphanSectionHTML(trip, orphans) : "") +
      `<button class="btn" data-action="add-activity">+ Add Activity</button>`;
  } else {
    let dayActs, heading;
    if (state.selectedDate === "other") {
      dayActs = orphans;
      heading = "Activities outside the trip dates — edit them to pick a day";
    } else {
      dayActs = trip.activities.filter(a => a.date === state.selectedDate);
      heading = `${fmtDate(state.selectedDate, { weekday: "long", month: "long", day: "numeric" })} · Day ${days.indexOf(state.selectedDate) + 1} of ${days.length}`;
    }
    const isRealDay = state.selectedDate !== "other";
    dayActs.sort(isRealDay ? byDayOrder : byStartTime);
    const reordering = isRealDay && state.reorderDate === state.selectedDate;

    let list = "";
    if (dayActs.length === 0) {
      list = `<div class="empty"><span class="big">🗓️</span>Nothing planned for this day yet.</div>`;
    } else {
      const cards = dayActs.map((a, i) => activityCardHTML(trip, a, reordering, i === 0, i === dayActs.length - 1)).join("");
      list = isRealDay ? `<div class="day-cards" data-date="${state.selectedDate}">${cards}</div>` : cards;
      const dayTotal = dayActs.reduce((s, a) => s + (a.cost || 0), 0);
      if (dayTotal) list += `<div class="day-total">Day total: <b>${fmtMoney(dayTotal, trip.currency)}</b></div>`;
    }
    itinerary = `<div class="day-heading"><span>${heading}</span>
        ${isRealDay && dayActs.length ? `<button class="mini-add" data-action="toggle-reorder" data-date="${state.selectedDate}">${reordering ? "✓ Done" : "✎ Edit"}</button>` : ""}
      </div>
      ${list}
      ${mapSectionHTML(dayActs, state.selectedDate)}
      <button class="btn" data-action="add-activity">+ Add Activity</button>`;
  }

  const tabs = `
    <div class="tabs">
      <button class="${state.tab === "budget" ? "" : "selected"}" data-action="set-tab" data-tab="itinerary">Itinerary</button>
      <button class="${state.tab === "budget" ? "selected" : ""}" data-action="set-tab" data-tab="budget">Budget</button>
    </div>`;

  const content = state.tab === "budget"
    ? renderBudgetHTML(trip)
    : `<div class="day-chips">${chips}</div>${itinerary}`;

  $app.innerHTML = `
    <p class="trip-sub">${esc(trip.destination)} · ${fmtRange(trip.startDate, trip.endDate)}</p>
    ${tabs}
    ${content}`;
}

/* ----- Budget screen ----- */

function renderBudgetHTML(trip) {
  const total = tripTotalCost(trip);
  const cur = trip.currency;

  // Hero: total spent, with a budget meter when a budget is set.
  let hero = `<div class="budget-card">
    <p class="hero-label">Total spent</p>
    <p class="hero-value">${fmtMoney(total, cur)}</p>`;
  if (trip.budget) {
    const pct = (total / trip.budget) * 100;
    const cls = pct > 100 ? " over" : pct >= 85 ? " warn" : "";
    hero += `
    <div class="meter"><div class="meter-fill${cls}" style="width:${Math.min(100, pct).toFixed(1)}%"></div></div>
    <p class="hero-sub">${pct > 100
      ? `⚠️ Over budget by ${fmtMoney(total - trip.budget, cur)} · budget ${fmtMoney(trip.budget, cur)}`
      : `${Math.round(pct)}% of ${fmtMoney(trip.budget, cur)} budget · ${fmtMoney(trip.budget - total, cur)} left`}</p>`;
  } else {
    hero += `<p class="hero-sub">No budget set — add one via Edit to track spending against it.</p>`;
  }
  hero += `</div>`;

  if (total === 0) {
    return hero + `<div class="empty"><span class="big">💸</span>
      No costs yet.<br>Add costs to activities and the breakdown appears here.</div>`;
  }

  // By category, largest first.
  const byCat = new Map();
  for (const a of trip.activities) {
    if (a.cost) byCat.set(a.category, (byCat.get(a.category) || 0) + a.cost);
  }
  const cats = [...byCat.entries()].sort((x, y) => y[1] - x[1]);
  const maxCat = cats.length ? cats[0][1] : 0;
  let catRows = "";
  for (const [key, amount] of cats) {
    catRows += `<div class="brk-row">
      <div class="brk-label">${categoryLabel(key)}</div>
      <div><div class="brk-bar" style="width:${(amount / maxCat * 100).toFixed(1)}%"></div></div>
      <div class="brk-val">${fmtMoney(amount, cur)}</div>
    </div>`;
  }

  // By day, chronological; orphan activities grouped as "Other".
  const days = tripDays(trip);
  const byDay = new Map(days.map(d => [d, 0]));
  let orphanCost = 0;
  for (const a of trip.activities) {
    if (!a.cost) continue;
    if (byDay.has(a.date)) byDay.set(a.date, byDay.get(a.date) + a.cost);
    else orphanCost += a.cost;
  }
  const maxDay = Math.max(...byDay.values(), orphanCost);
  let dayRows = "";
  days.forEach((d, i) => {
    const amount = byDay.get(d);
    dayRows += `<div class="brk-row">
      <div class="brk-label">Day ${i + 1} <span class="sub">· ${fmtDate(d, { weekday: "short", month: "short", day: "numeric" })}</span></div>
      <div>${amount ? `<div class="brk-bar" style="width:${(amount / maxDay * 100).toFixed(1)}%"></div>` : ""}</div>
      <div class="brk-val${amount ? "" : " zero"}">${amount ? fmtMoney(amount, cur) : "–"}</div>
    </div>`;
  });
  if (orphanCost) {
    dayRows += `<div class="brk-row">
      <div class="brk-label">⚠️ Other <span class="sub">· outside trip dates</span></div>
      <div><div class="brk-bar" style="width:${(orphanCost / maxDay * 100).toFixed(1)}%"></div></div>
      <div class="brk-val">${fmtMoney(orphanCost, cur)}</div>
    </div>`;
  }

  return hero +
    `<div class="section-title">By category</div>${catRows}` +
    `<div class="section-title">By day</div>${dayRows}`;
}

/* ================= Form submission ================= */

document.addEventListener("submit", e => {
  e.preventDefault();
  const form = e.target;
  const f = new FormData(form);

  if (form.id === "trip-form") {
    let startDate = f.get("startDate"), endDate = f.get("endDate");
    if (endDate < startDate) [startDate, endDate] = [endDate, startDate];
    const budget = parseFloat(f.get("budget"));
    const fields = {
      name: f.get("name").trim(),
      destination: f.get("destination").trim(),
      startDate, endDate,
      currency: (f.get("currency") || "").trim() || "$",
      budget: (isNaN(budget) || budget <= 0) ? null : budget,
    };
    const existing = getTrip(form.dataset.id);
    if (existing) {
      Object.assign(existing, fields);
    } else {
      const trip = Object.assign({ id: uid(), activities: [] }, fields);
      db.trips.push(trip);
      state.tripId = trip.id;
    }
    state.view = "trip";
    if (state.selectedDate !== "all") state.selectedDate = null;
    save(); closeModal(); render();
  }

  if (form.id === "activity-form") {
    const trip = getTrip(state.tripId);
    if (!trip) return;
    const cost = parseFloat(f.get("cost"));
    const fields = {
      title: f.get("title").trim(),
      date: f.get("date"),
      startTime: f.get("startTime"),
      endTime: f.get("endTime"),
      category: f.get("category"),
      location: f.get("location").trim(),
      cost: isNaN(cost) ? null : cost,
      notes: f.get("notes").trim(),
    };
    const existing = trip.activities.find(a => a.id === form.dataset.id);
    if (existing) {
      if (fields.date !== existing.date) existing.order = null; // moved days: rejoin by time
      Object.assign(existing, fields);
    } else {
      trip.activities.push(Object.assign({ id: uid() }, fields));
    }
    if (state.selectedDate !== "all" && tripDays(trip).includes(fields.date)) state.selectedDate = fields.date;
    save(); closeModal(); render();
    if (state.selectedDate === "all") scrollToDay(fields.date);
  }
});

/* ================= Hold-to-drag reordering ================= */
/* Long-press a card (~250ms without moving) to lift it, drag within its
   day, release to drop. A quick swipe scrolls as usual; the hold is
   cancelled if the finger wanders before the timer fires. */

const drag = {
  timer: null, active: false,
  el: null, wrap: null, ghost: null,
  startX: 0, startY: 0, liftY: 0, clientY: 0,
};
let suppressClick = false;

function blockScrollWhileDragging(e) {
  if (drag.active) e.preventDefault();
}

function cancelHold() {
  clearTimeout(drag.timer);
  drag.timer = null;
  drag.el = null;
  drag.wrap = null;
}

function startDrag() {
  drag.timer = null;
  if (!drag.el) return;
  drag.active = true;
  drag.liftY = drag.clientY;
  const rect = drag.el.getBoundingClientRect();
  const ghost = drag.el.cloneNode(true);
  ghost.classList.add("drag-ghost");
  ghost.style.width = rect.width + "px";
  ghost.style.left = rect.left + "px";
  ghost.style.top = rect.top + "px";
  document.body.appendChild(ghost);
  drag.ghost = ghost;
  drag.el.classList.add("drag-src");
  document.addEventListener("touchmove", blockScrollWhileDragging, { passive: false });
  if (navigator.vibrate) navigator.vibrate(10);
  requestAnimationFrame(autoScrollLoop);
}

// The dimmed source card doubles as the live drop preview: it is moved
// within its day container as the pointer crosses card midpoints.
function updateInsertion() {
  const y = drag.clientY;
  let before = null;
  for (const c of drag.wrap.children) {
    if (c === drag.el || !c.classList.contains("activity")) continue;
    const r = c.getBoundingClientRect();
    if (y < r.top + r.height / 2) { before = c; break; }
  }
  if (before) {
    if (before.previousElementSibling !== drag.el) drag.wrap.insertBefore(drag.el, before);
  } else if (drag.wrap.lastElementChild !== drag.el) {
    drag.wrap.appendChild(drag.el);
  }
}

// Keep scrolling when the finger is held near the top/bottom of the screen.
function autoScrollLoop() {
  if (!drag.active) return;
  const margin = 100, y = drag.clientY;
  if (y < margin) window.scrollBy(0, -Math.min(24, (margin - y) / 3));
  else if (y > innerHeight - margin) window.scrollBy(0, Math.min(24, (y - (innerHeight - margin)) / 3));
  updateInsertion();
  requestAnimationFrame(autoScrollLoop);
}

function endDrag() {
  if (drag.timer) { cancelHold(); return; } // released before the hold fired: normal tap
  if (!drag.active) return;
  drag.active = false;
  document.removeEventListener("touchmove", blockScrollWhileDragging);
  drag.ghost.remove();
  drag.ghost = null;
  drag.el.classList.remove("drag-src");

  // Persist the day's DOM order as the manual order.
  const trip = getTrip(state.tripId);
  if (trip) {
    const ids = [...drag.wrap.querySelectorAll(".activity")].map(el => el.dataset.id);
    ids.forEach((id, i) => {
      const a = trip.activities.find(x => x.id === id);
      if (a) a.order = i;
    });
    save();
  }
  drag.el = null;
  drag.wrap = null;

  // The pointerup may still produce a click on the card — swallow it.
  suppressClick = true;
  setTimeout(() => { suppressClick = false; }, 350);

  const y = window.scrollY;
  render();
  window.scrollTo(0, y);
}

$app.addEventListener("pointerdown", e => {
  if (e.button !== 0) return;
  if (e.target.closest("a,button")) return; // links/buttons keep their own gestures
  const card = e.target.closest(".activity");
  const wrap = card && card.parentElement;
  if (!card || !wrap || !wrap.classList.contains("day-cards")) return;
  drag.el = card;
  drag.wrap = wrap;
  drag.startX = e.clientX;
  drag.startY = e.clientY;
  drag.clientY = e.clientY;
  drag.timer = setTimeout(startDrag, 250);
});

document.addEventListener("pointermove", e => {
  drag.clientY = e.clientY;
  if (drag.timer && !drag.active) {
    // finger wandered before the hold fired: it's a scroll, not a drag
    if (Math.hypot(e.clientX - drag.startX, e.clientY - drag.startY) > 8) cancelHold();
  } else if (drag.active) {
    drag.ghost.style.transform = `translateY(${e.clientY - drag.liftY}px) scale(1.02)`;
    updateInsertion();
  }
});

document.addEventListener("pointerup", endDrag);
document.addEventListener("pointercancel", endDrag);
$app.addEventListener("contextmenu", e => {
  if (drag.active || drag.timer) e.preventDefault();
});

/* ================= Click handling ================= */

document.addEventListener("click", e => {
  // A click generated by the tail end of a drag is not a tap.
  if (suppressClick) { suppressClick = false; return; }

  // Let real links (e.g. map links inside activity cards) navigate
  // without also triggering the card's action.
  if (e.target.closest("a[href]")) return;

  // Tap on the modal backdrop closes it.
  if (e.target === $modal) { closeModal(); return; }

  const el = e.target.closest("[data-action]");
  if (!el) return;
  const trip = getTrip(state.tripId);

  switch (el.dataset.action) {
    case "new-trip":
      openTripForm(null);
      break;
    case "open-trip":
      state.view = "trip";
      state.tripId = el.dataset.id;
      state.selectedDate = null;
      state.tab = "itinerary";
      state.reorderDate = null;
      render();
      break;
    case "set-tab":
      state.tab = el.dataset.tab;
      render();
      break;
    case "edit-trip":
      openTripForm(getTrip(el.dataset.id));
      break;
    case "delete-trip": {
      const t = getTrip(el.dataset.id);
      if (t && confirm(`Delete "${t.name}" and all its activities?`)) {
        db.trips = db.trips.filter(x => x.id !== t.id);
        state.view = "trips";
        save(); closeModal(); render();
      }
      break;
    }
    case "back":
      state.view = "trips";
      state.tripId = null;
      state.reorderDate = null;
      render();
      break;
    case "select-day": {
      const d = el.dataset.date;
      if (state.selectedDate === "all" && d !== "all") {
        scrollToDay(d, true); // in overview, day chips jump-scroll
      } else if (d === "all" && state.selectedDate === "all") {
        state.selectedDate = null; // tap All again to go back to one day
        render();
      } else {
        state.selectedDate = d;
        render();
      }
      break;
    }
    case "toggle-map": {
      // Inject/remove the map iframe in place — no re-render, so the page
      // doesn't jump and the map stays put while you scroll the day.
      const wrap = el.parentElement;
      const open = wrap.querySelector("iframe");
      if (open) {
        open.remove();
        el.setAttribute("aria-expanded", "false");
        el.textContent = "🗺️ " + el.dataset.label;
      } else {
        const frame = document.createElement("iframe");
        frame.className = "day-map-frame";
        frame.loading = "lazy";
        frame.referrerPolicy = "no-referrer-when-downgrade";
        frame.setAttribute("allowfullscreen", "");
        frame.src = el.dataset.src;
        wrap.appendChild(frame);
        el.setAttribute("aria-expanded", "true");
        el.textContent = "🗺️ Hide map";
      }
      break;
    }
    case "add-activity":
      if (trip) openActivityForm(trip, null, el.dataset.date);
      break;
    case "toggle-reorder": {
      state.reorderDate = state.reorderDate === el.dataset.date ? null : el.dataset.date;
      const y = window.scrollY;
      render();
      window.scrollTo(0, y);
      break;
    }
    case "move-act": {
      if (!trip) break;
      moveActivity(trip, el.dataset.id, el.dataset.dir);
      const y = window.scrollY;
      render();
      window.scrollTo(0, y);
      break;
    }
    case "edit-activity": {
      if (!trip) break;
      const a = trip.activities.find(x => x.id === el.dataset.id);
      if (a && a.date === state.reorderDate) break; // card taps are inert while reordering that day
      openActivityForm(trip, a);
      break;
    }
    case "delete-activity": {
      if (!trip) break;
      const a = trip.activities.find(x => x.id === el.dataset.id);
      if (a && confirm(`Delete "${a.title}"?`)) {
        trip.activities = trip.activities.filter(x => x.id !== a.id);
        const y = window.scrollY;
        save(); closeModal(); render();
        window.scrollTo(0, y);
      }
      break;
    }
    case "export-trip": {
      const t = getTrip(el.dataset.id);
      if (t) exportTrip(t);
      break;
    }
    case "share-trip": {
      const t = getTrip(el.dataset.id);
      if (t) shareTrip(t);
      break;
    }
    case "import-trip":
      document.getElementById("import-file").click();
      break;
    case "close-modal":
      closeModal();
      break;
  }
});

/* ================= Import file handling ================= */

document.getElementById("import-file").addEventListener("change", async e => {
  const file = e.target.files[0];
  e.target.value = ""; // allow picking the same file again later
  if (!file) return;
  try {
    importTripFromData(JSON.parse(await file.text()));
  } catch (err) {
    alert("Couldn't import: " + (err instanceof SyntaxError ? "this isn't a valid JSON file" : err.message));
  }
});

render();
handleSharedLink();

/* ================= PWA ================= */

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("./sw.js").catch(() => {});
}
</script>
